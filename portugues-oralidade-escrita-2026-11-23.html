<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Português — 23 e 25 de novembro</title>
<style>
/* ===================================================================
 * Fichas de revisão — estilos
 * Paleta inspirada nos azulejos: azuis, branco-sujo, um toque de amarelo.
 * Verde e laranja vêm sempre com um ícone.
 * =================================================================== */

:root {
  --fundo: #f5f2ea;
  --papel: #fffdf8;
  --branco: #ffffff;
  --azul-escuro: #16407a;
  --azul: #2f68b0;
  --azul-claro: #9cbbe3;
  --azul-palido: #e3ecf8;
  --azul-muito-palido: #f1f6fc;
  --amarelo: #e0aa2e;
  --amarelo-claro: #fbefcd;
  --amarelo-texto: #6f4f05;
  --texto: #1b2a3a;
  --texto-suave: #4a5a6c;
  --verde: #23703f;
  --verde-claro: #def0e3;
  --laranja: #a3471f;
  --laranja-claro: #f8e4d9;
  --cinzento: #6b7685;
  --cinzento-claro: #eceff3;
  --sombra: 0 2px 6px rgba(22, 64, 122, 0.10), 0 8px 24px rgba(22, 64, 122, 0.08);
  --raio: 18px;
  --letra: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { font-size: 20px; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--letra);
  font-size: 1rem;
  line-height: 1.5;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 28px 40px;
}

h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 0.4em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 0.6em; }
strong { font-weight: 700; }

/* ---------- Botões ---------- */

.botao {
  font: inherit;
  font-size: 1rem;
  min-height: 48px;
  padding: 10px 22px;
  border-radius: 14px;
  border: 2px solid var(--azul);
  background: var(--papel);
  color: var(--azul-escuro);
  cursor: pointer;
  line-height: 1.25;
  transition: background-color 150ms, border-color 150ms, transform 150ms, box-shadow 150ms;
}
.botao:hover:not(:disabled) { background: var(--azul-muito-palido); }
.botao:active:not(:disabled) { transform: translateY(1px); }
.botao:disabled { cursor: default; }
.botao.principal { background: var(--azul); border-color: var(--azul); color: var(--branco); font-weight: 700; }
.botao.principal:hover:not(:disabled) { background: var(--azul-escuro); border-color: var(--azul-escuro); }
.botao.secundario { background: var(--papel); }
.botao.discreto { background: transparent; border-color: transparent; color: var(--texto-suave); padding: 8px 14px; }
.botao.discreto:hover:not(:disabled) { background: var(--azul-palido); color: var(--azul-escuro); }
.botao.com-icone { display: inline-flex; align-items: center; gap: 8px; }

:focus-visible { outline: 4px solid var(--amarelo); outline-offset: 3px; }
.area-item:focus { outline: none; }

.icone {
  width: 24px; height: 24px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- Escolhas ---------- */

.escolhas {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  max-width: 900px;
}
.escolhas.uma-coluna { grid-template-columns: minmax(0, 1fr); }
.escolhas.muitas { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.opcao {
  position: relative;
  min-height: 64px;
  padding: 12px 18px;
  font-size: 1.3rem;
  border: 3px solid var(--azul-claro);
  background: var(--papel);
  color: var(--texto);
  border-radius: 16px;
  text-align: center;
}
.opcao:hover:not(:disabled) { border-color: var(--azul); background: var(--azul-muito-palido); }
.opcao.escolhido { border-color: var(--azul); background: var(--azul-palido); box-shadow: inset 0 0 0 2px var(--azul); }
.opcao.tentado { border-style: dashed; border-color: var(--cinzento); color: var(--cinzento); background: var(--cinzento-claro); }
.opcao.certo, .opcao.mostrado { border-color: var(--verde); background: var(--verde-claro); color: var(--texto); padding-left: 48px; }
.opcao.mostrado { border-style: dashed; }
.opcao.certo::before, .opcao.mostrado::before {
  content: "✓"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  font-weight: 700; color: var(--verde); font-size: 1.3rem;
}
.opcao.errado { border-color: var(--laranja); background: var(--laranja-claro); padding-left: 48px; }
.opcao.errado::before {
  content: "✗"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  font-weight: 700; color: var(--laranja); font-size: 1.2rem;
}
.opcao:disabled { cursor: default; }
.escolhas.bloqueado .opcao:not(.certo):not(.mostrado):not(.errado):not(.escolhido) { opacity: 0.6; }

.desafio .opcao.escolhido, .ecra-desafio .opcao.escolhido { border-color: var(--azul-escuro); background: var(--azul-palido); }

/* ---------- Campos ---------- */

.campo {
  font: inherit;
  font-size: 1.3rem;
  padding: 8px 14px;
  min-height: 52px;
  border: 3px solid var(--azul-claro);
  border-radius: 12px;
  background: var(--branco);
  color: var(--texto);
  min-width: 5ch;
}
.campo:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 4px var(--amarelo-claro); }
.campo-numero { font-size: 1.6rem; text-align: center; width: 7ch; }
.campo.certo { border-color: var(--verde); background: var(--verde-claro); }
.campo.tentar { border-color: var(--amarelo); background: var(--amarelo-claro); }
.campo.mostrado { border-color: var(--verde); border-style: dashed; background: var(--verde-claro); }

.campo-com-acentos { display: inline-flex; flex-direction: column; gap: 10px; }
.barra-acentos { display: flex; flex-wrap: wrap; gap: 6px; }
.acento {
  min-width: 46px; min-height: 46px; padding: 4px 8px;
  font-size: 1.15rem; border-radius: 10px; border-width: 2px;
  border-color: var(--azul-claro);
}
.maiusculas-botao { font-size: 0.85rem; }

/* ---------- Pegar e pousar ---------- */

.peca { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
.peca.fixo { cursor: default; }
.peca.na-mao {
  outline: 4px solid var(--amarelo); outline-offset: 2px;
  transform: translateY(-3px); box-shadow: 0 8px 18px rgba(22, 64, 122, 0.25);
}
.peca.a-arrastar { opacity: 0.35; }
.fantasma {
  position: fixed; z-index: 1000; pointer-events: none; margin: 0;
  opacity: 0.92; box-shadow: 0 12px 28px rgba(22, 64, 122, 0.3); transform: rotate(-2deg);
}
.destino.por-baixo { outline: 4px dashed var(--amarelo); outline-offset: 2px; }

/* ---------- Menu e janelas ---------- */

.menu-escolha {
  position: absolute; z-index: 900;
  display: flex; flex-wrap: wrap; gap: 8px; max-width: 420px;
  padding: 10px; background: var(--papel);
  border: 2px solid var(--azul); border-radius: 14px; box-shadow: var(--sombra);
}
.menu-titulo { width: 100%; margin: 0 4px 2px; font-size: 0.85rem; color: var(--texto-suave); }
.opcao-menu { min-height: 52px; min-width: 64px; font-size: 1.25rem; border-color: var(--azul-claro); }

.modal-fundo {
  position: fixed; inset: 0; z-index: 950;
  background: rgba(16, 32, 56, 0.45);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: aparecer 200ms ease-out;
}
.modal {
  background: var(--papel); border-radius: 22px; padding: 28px 30px 24px;
  max-width: 580px; width: 100%; box-shadow: var(--sombra);
  border-top: 8px solid var(--azul);
}
.modal-lembra { border-top-color: var(--amarelo); }
.modal-titulo { font-size: 1.4rem; color: var(--azul-escuro); }
.modal-botoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.lembra-regra { font-size: 1.15rem; }
.lembra-exemplo { background: var(--amarelo-claro); border-radius: 14px; padding: 12px 16px; }
.lembra-rotulo { display: block; font-size: 0.85rem; font-weight: 700; color: var(--amarelo-texto); text-transform: uppercase; letter-spacing: 0.04em; }
.lembra-exemplo p { margin: 4px 0 0; font-size: 1.15rem; }

/* ---------- Início ---------- */

/* A ilustração ocupa a largura toda; o título fica por baixo, como a legenda
   de um postal, para nunca tapar o desenho, seja qual for o comprimento do título. */
.cabecalho-inicio {
  position: relative; border-radius: 24px; overflow: hidden;
  background: var(--papel); box-shadow: var(--sombra); margin-bottom: 20px;
}
.ilustracao-tema { display: block; width: 100%; height: 190px; background: var(--azul-palido); }
.titulo-ficha {
  padding: 14px 24px 16px;
  border-top: 4px solid var(--azul-escuro);
}
.titulo-ficha h1 { margin: 0; font-size: 1.7rem; color: var(--azul-escuro); }
.titulo-ficha p { margin: 2px 0 0; color: var(--texto-suave); }

.painel {
  position: relative; overflow: hidden;
  background: var(--papel); border-radius: var(--raio); padding: 16px 20px 12px;
  box-shadow: var(--sombra); margin-bottom: 28px;
}
.painel-cabecalho { display: flex; align-items: baseline; gap: 12px; }
.painel-cabecalho h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--azul-escuro); }
.painel-contagem { color: var(--texto-suave); font-size: 0.9rem; }
.painel-grelha { display: flex; flex-wrap: wrap; gap: 4px; }
.painel-casa { display: block; width: 62px; height: 62px; }
.painel-casa .azulejo { width: 100%; height: 100%; display: block; border-radius: 3px; }
.painel-ajuda { margin: 10px 0 0; font-size: 0.85rem; color: var(--texto-suave); }
.painel.completo .painel-ajuda { color: var(--azul-escuro); font-weight: 700; font-size: 1rem; }
.painel.festa .painel-casa { animation: brilho 700ms ease-out both; }
.confetes { position: absolute; inset: 0; pointer-events: none; }
.confetes i {
  position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px;
  background: var(--amarelo); animation: cair 1400ms ease-in forwards;
}
.confetes i:nth-child(3n) { background: var(--azul); }
.confetes i:nth-child(3n+1) { background: var(--azul-claro); }

.dominio { margin-bottom: 28px; }
.dominio-titulo { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 1.25rem; color: var(--azul-escuro); }
.dominio-etapa {
  background: var(--amarelo-claro); color: var(--amarelo-texto);
  border-radius: 999px; padding: 3px 14px; font-size: 0.85rem; font-weight: 700;
}
/* 320 px no mínimo: com o ícone e o azulejo ganho, o título ainda cabe em duas linhas. */
.grelha-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 16px; }

.cartao-atividade {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 96px; padding: 14px 16px; text-align: left;
  background: var(--papel); color: var(--texto);
  border: 3px solid var(--azul-palido); border-radius: var(--raio);
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.cartao-atividade:hover:not(:disabled):not(.bloqueado) { border-color: var(--azul-claro); background: var(--papel); transform: translateY(-2px); box-shadow: var(--sombra); }
.cartao-icone {
  flex: none; width: 54px; height: 54px; border-radius: 50%;
  background: var(--azul-palido); color: var(--azul);
  display: flex; align-items: center; justify-content: center;
}
.cartao-icone .icone { width: 30px; height: 30px; }
.cartao-corpo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cartao-titulo { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.cartao-estado { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--texto-suave); }
.cartao-estado .icone { width: 18px; height: 18px; }
.cartao-azulejo { margin-left: auto; flex: none; width: 46px; height: 46px; }
.cartao-azulejo .azulejo { width: 100%; height: 100%; display: block; border-radius: 3px; }
.cartao-atividade.estado-curso { border-color: var(--amarelo); }
.cartao-atividade.estado-curso .cartao-icone { background: var(--amarelo-claro); color: var(--amarelo-texto); }
.cartao-atividade.estado-feita .cartao-icone,
.cartao-atividade.estado-azulejo .cartao-icone,
.cartao-atividade.estado-dourado .cartao-icone { background: var(--azul); color: var(--branco); }
.cartao-atividade.estado-dourado { border-color: var(--amarelo); }

.dominio-desafio .grelha-cartoes { grid-template-columns: minmax(0, 560px); }
.cartao-desafio { background: var(--azul-escuro); border-color: var(--azul-escuro); color: var(--branco); }
.cartao-desafio .cartao-estado { color: var(--azul-palido); }
.cartao-desafio .cartao-icone { background: var(--amarelo); color: var(--azul-escuro); }
.cartao-desafio:hover:not(.bloqueado) { background: var(--azul) !important; }
.cartao-desafio.bloqueado { background: var(--cinzento-claro); border-color: var(--cinzento-claro); color: var(--texto-suave); cursor: not-allowed; }
.cartao-desafio.bloqueado .cartao-estado { color: var(--texto-suave); }
.cartao-desafio.bloqueado .cartao-icone { background: var(--branco); color: var(--cinzento); }

.rodape-inicio { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 30px; padding-top: 16px; border-top: 2px solid var(--azul-palido); }
.aviso-guardar { text-align: center; font-size: 0.8rem; color: var(--texto-suave); }

/* ---------- Atividade ---------- */

.barra-atividade {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px;
  padding-bottom: 12px; border-bottom: 3px solid var(--azul-palido);
}
.titulo-atividade { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-width: 0; }
.titulo-atividade h1 { font-size: 1.35rem; margin: 0; color: var(--azul-escuro); }
.etiqueta-ronda { background: var(--amarelo-claro); color: var(--amarelo-texto); border-radius: 999px; padding: 2px 12px; font-size: 0.8rem; font-weight: 700; }
.pontos { display: flex; gap: 7px; flex-wrap: wrap; max-width: 300px; }
.ponto { width: 15px; height: 15px; border-radius: 50%; background: var(--azul-palido); }
.ponto.feito { background: var(--azul); }
.ponto.atual { background: var(--papel); box-shadow: inset 0 0 0 3px var(--azul); }
.botao.lembra { border-color: var(--amarelo); background: var(--amarelo-claro); color: var(--amarelo-texto); font-weight: 700; }
.botao.lembra:hover { background: #f7e3ad !important; }

.instrucao { font-size: 1.2rem; font-weight: 600; margin: 20px 0 16px; color: var(--azul-escuro); }

.area-item { min-height: 260px; padding: 4px 0 150px; }
.area-item.terminado button, .area-item.terminado input { pointer-events: none; }

.pergunta { font-size: 1.4rem; line-height: 1.4; margin: 0 0 22px; max-width: 900px; }
.ajuda { font-size: 0.85rem; color: var(--texto-suave); margin: 10px 0; }
.acoes-item { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }

/* ---------- Retorno ---------- */

.retorno { display: none; }
.retorno.visivel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  max-width: 1176px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 22px;
  border-radius: 20px 20px 0 0;
  border-top: 5px solid var(--azul);
  background: var(--papel);
  box-shadow: 0 -6px 20px rgba(22, 64, 122, 0.12);
  animation: subir 260ms ease-out;
}
.retorno.certo { border-top-color: var(--verde); background: #f1f9f3; }
.retorno.quase { border-top-color: var(--amarelo); background: #fff8e6; }
.retorno.ver { border-top-color: var(--azul); background: var(--azul-muito-palido); }
.retorno.registado, .retorno.continuar { border-top-color: var(--azul-claro); }
.retorno-icone { flex: none; width: 64px; display: flex; align-items: center; justify-content: center; color: var(--azul); }
.retorno-icone .icone { width: 40px; height: 40px; }
.retorno.certo .retorno-icone { color: var(--verde); }
.retorno.quase .retorno-icone { color: var(--amarelo-texto); }
.andorinha-retorno { width: 72px; height: 48px; }
.retorno-texto { flex: 1; min-width: 0; }
.retorno-mensagem { font-size: 1.25rem; font-weight: 700; margin: 0; }
.retorno-extra { margin: 4px 0 0; font-size: 1.05rem; }
.botao-continuar { flex: none; min-width: 160px; font-size: 1.1rem; min-height: 56px; }
.retorno-acao { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 230px; }
.retorno-dica-avancar { margin: 0; font-size: 0.72rem; line-height: 1.3; color: var(--texto-suave); text-align: center; }
.retorno-dica-avancar .com-toque { display: none; }
@media (hover: none) and (pointer: coarse) {
  .retorno-dica-avancar .com-rato { display: none; }
  .retorno-dica-avancar .com-toque { display: inline; }
}

/* ---------- Código QR (texto para o adulto no telemóvel) ---------- */

.caixa-qr { display: flex; align-items: center; gap: 14px; }
.caixa-qr .qr { width: 132px; height: 132px; flex: none; border-radius: 8px; box-shadow: 0 1px 4px rgba(22, 64, 122, 0.18); }
.caixa-qr p { margin: 0; font-size: 0.8rem; line-height: 1.35; color: var(--texto-suave); max-width: 260px; }
.qr-atividade { float: right; margin: 6px 0 10px 18px; padding: 10px 12px; background: var(--papel); border-radius: 14px; border: 2px dashed var(--amarelo); max-width: 430px; }
.qr-pagina { margin-top: 14px; }
.texto-adulto.em-destaque { border-left-color: var(--amarelo); background: var(--amarelo-claro); border-radius: 0 12px 12px 0; padding: 6px 12px 6px 16px; }

/* ---------- Fim de atividade, desafio ---------- */

.cartao-fim {
  max-width: 660px; margin: 30px auto; padding: 32px 36px;
  background: var(--papel); border-radius: 26px; box-shadow: var(--sombra); text-align: center;
}
.cartao-fim h1 { color: var(--azul-escuro); }
.fim-atividade { color: var(--texto-suave); margin: 0; }
.fim-azulejo { width: 150px; height: 150px; margin: 14px auto 10px; }
.fim-azulejo .azulejo { width: 100%; height: 100%; display: block; border-radius: 6px; box-shadow: var(--sombra); }
.fim-azulejo.aparece .azulejo { animation: pousar 450ms cubic-bezier(.2, 1.4, .4, 1) both; }
.fim-ganhou { font-size: 1.25rem; font-weight: 700; color: var(--azul-escuro); }
.fim-resultado { font-size: 1.3rem; font-weight: 700; }
.fim-faltam { font-size: 1.1rem; }
.fim-explica { color: var(--texto-suave); }
.fim-botoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
.desafio-icone { display: inline-flex; width: 76px; height: 76px; border-radius: 50%; background: var(--amarelo); color: var(--azul-escuro); align-items: center; justify-content: center; margin-bottom: 10px; }
.desafio-icone .icone { width: 44px; height: 44px; }

.barra-desafio { border-bottom-color: var(--cinzento-claro); }
.desafio-contagem { font-weight: 700; color: var(--texto-suave); }
.folha-desafio {
  position: relative; margin-top: 22px; padding: 26px 32px 24px 64px;
  background: var(--branco); border: 1px solid #d3dae4; border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  background-image: linear-gradient(to right, transparent 46px, #e9c3b8 46px, #e9c3b8 48px, transparent 48px);
}
.folha-desafio .numero-pergunta { position: absolute; left: 14px; top: 26px; font-weight: 700; font-size: 1.2rem; color: var(--texto-suave); }
.folha-desafio .instrucao { margin-top: 0; color: var(--texto); }

.cabecalho-simples { margin: 10px 0 22px; }
.cabecalho-simples h1 { color: var(--azul-escuro); }
.subtitulo { color: var(--texto-suave); margin: 0; }
.lista-correcoes { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.correcao { display: flex; gap: 14px; background: var(--papel); border-radius: 16px; padding: 16px 20px; box-shadow: var(--sombra); }
.correcao .numero-pergunta { font-weight: 700; color: var(--texto-suave); }
.correcao-enunciado { font-size: 1.1rem; }
.correcao-resposta { color: var(--verde); }
.correcao-resposta strong { color: var(--texto); }
.correcao-explicacao { color: var(--texto-suave); margin: 0; }

/* ---------- Balanço ---------- */

.tabela-balanco { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
.tabela-balanco td { background: var(--papel); padding: 12px 16px; vertical-align: middle; }
.tabela-balanco td:first-child { border-radius: 14px 0 0 14px; width: 1%; white-space: nowrap; }
.tabela-balanco td:last-child { border-radius: 0 14px 14px 0; }
.pastilha { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
.pastilha .icone { width: 20px; height: 20px; stroke-width: 2.6; }
.pastilha-verde { background: var(--verde-claro); color: var(--verde); }
.pastilha-amarelo { background: var(--amarelo-claro); color: var(--amarelo-texto); }
.pastilha-vermelho { background: var(--laranja-claro); color: var(--laranja); }
.pastilha-cinzento { background: var(--cinzento-claro); color: var(--cinzento); }
.competencia-rotulo { margin: 0; font-weight: 600; }
.competencia-contagem { margin: 2px 0 0; font-size: 0.85rem; color: var(--texto-suave); }
.competencia-rever { margin: 2px 0 0; font-size: 0.9rem; color: var(--azul-escuro); }

/* ---------- Para o adulto ---------- */

[data-ecra="adulto"] .app { max-width: 880px; }
.cabecalho-adulto { margin: 6px 0 20px; }
.cabecalho-adulto h1 { color: var(--azul-escuro); }
.botoes-adulto { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.secao-adulto { background: var(--papel); border-radius: var(--raio); padding: 20px 24px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08); }
.secao-adulto h2 { color: var(--azul-escuro); font-size: 1.2rem; border-bottom: 2px solid var(--azul-palido); padding-bottom: 6px; }
.secao-adulto h3 { font-size: 1.05rem; margin-top: 14px; }
.secao-adulto h4 { font-size: 0.95rem; margin: 12px 0 4px; color: var(--azul-escuro); }
.secao-adulto ul, .secao-adulto ol { padding-left: 1.3em; margin: 6px 0; }
.secao-adulto li { margin-bottom: 4px; }
.nota { font-size: 0.85rem; color: var(--texto-suave); }
.texto-adulto { border-left: 5px solid var(--azul-claro); padding-left: 16px; margin-bottom: 18px; }
.texto-adulto p { font-size: 1.1rem; line-height: 1.7; }
.instrucao-adulto { font-style: italic; color: var(--texto-suave); font-size: 0.95rem !important; }
.papel { border-top: 1px dashed var(--azul-claro); padding-top: 8px; }
.papel:first-of-type { border-top: 0; }
.papel-rotulo { font-weight: 700; font-size: 0.9rem; margin-top: 10px; }
.grelha-papel { list-style: none; padding-left: 0 !important; }
.grelha-papel li { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.grelha-papel input { width: 26px; height: 26px; flex: none; }
.bloco-leitura { margin-top: 14px; }

.erro-fatal { padding: 30px; text-align: center; font-size: 1.2rem; }
.erro-item { max-width: 620px; padding: 22px 26px; background: var(--papel); border-radius: var(--raio); box-shadow: var(--sombra); font-size: 1.15rem; }

/* ---------- Animações ---------- */

@keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
@keyframes subir { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pousar {
  0% { transform: scale(0.3) rotate(-25deg); opacity: 0; }
  70% { transform: scale(1.08) rotate(3deg); opacity: 1; }
  100% { transform: none; }
}
@keyframes brilho {
  0% { transform: scale(1); filter: brightness(1); }
  40% { transform: scale(1.12); filter: brightness(1.15); }
  100% { transform: scale(1); filter: brightness(1); }
}
@keyframes cair {
  from { transform: translateY(0) rotate(0); opacity: 1; }
  to { transform: translateY(260px) rotate(320deg); opacity: 0; }
}
@keyframes tremer {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.tremer { animation: tremer 300ms ease-in-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Ecrãs mais estreitos ---------- */

@media (max-width: 900px) {
  .app { padding: 14px 16px 30px; }
  .barra-atividade { grid-template-columns: auto 1fr auto; }
  .barra-atividade .pontos { grid-column: 1 / -1; order: 5; }
  .qr-atividade { float: none; margin: 0 0 12px; }
  .escolhas.muitas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  html { font-size: 18px; }
  .app { padding: 10px 12px 24px; }
  .escolhas, .escolhas.muitas { grid-template-columns: minmax(0, 1fr); }
  .titulo-ficha { padding: 10px 16px 12px; }
  .titulo-ficha h1 { font-size: 1.3rem; }
  .ilustracao-tema { height: 130px; }
  .secao-adulto { padding: 14px 14px; }
  .retorno.visivel { flex-wrap: wrap; }
  .botao-continuar { width: 100%; }
  .retorno-acao { width: 100%; max-width: none; }
  .qr-pagina { display: none; }
  .folha-desafio { padding: 20px 16px 18px 46px; background-image: none; }
  .folha-desafio .numero-pergunta { left: 10px; top: 20px; }
  .tabela-balanco, .tabela-balanco tbody, .tabela-balanco tr, .tabela-balanco td { display: block; width: 100%; }
  .tabela-balanco tr { margin-bottom: 10px; }
  .tabela-balanco td:first-child { border-radius: 14px 14px 0 0; width: 100%; padding-bottom: 4px; }
  .tabela-balanco td:last-child { border-radius: 0 0 14px 14px; padding-top: 4px; }
}

/* ---------- Impressão ---------- */

@media print {
  html { font-size: 12pt; }
  body { background: #ffffff; }
  .app { max-width: none; padding: 0; }
  .nao-imprimir, .botao, .rodape-inicio, .retorno, .caixa-qr { display: none !important; }
  .secao-adulto, .tabela-balanco td, .cartao-fim, .correcao { box-shadow: none; background: #ffffff; }
  .secao-adulto { border: 1px solid #c8d2e0; break-inside: auto; }
  .texto-adulto, .papel { break-inside: avoid; }
  .tabela-balanco td { border-top: 1px solid #c8d2e0; border-bottom: 1px solid #c8d2e0; }
  .grelha-papel input { -webkit-appearance: none; appearance: none; border: 1.5px solid #333; border-radius: 3px; width: 16px; height: 16px; }
}

/* ===================================================================
 * Tipos
 * =================================================================== */

/* ---------- verdadeiro ---------- */

.afirmacao {
  font-size: 1.45rem; line-height: 1.4; max-width: 900px;
  background: var(--branco); border-left: 8px solid var(--azul-claro);
  border-radius: 12px; padding: 18px 22px; margin: 0 0 22px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.escolhas-vf { max-width: 620px; }
.escolhas-vf .opcao { min-height: 72px; font-weight: 700; }
.bloco-correcoes { margin-top: 26px; animation: subir 260ms ease-out; }
.pergunta-correcao { font-size: 1.2rem; font-weight: 600; color: var(--azul-escuro); margin-bottom: 14px; }
.escolhas-correcao .opcao { text-align: left; font-size: 1.2rem; }

/* ---------- classificar ---------- */

.classificar { display: flex; flex-direction: column; gap: 18px; }
.pilha {
  background: var(--branco); border: 2px solid var(--azul-palido); border-radius: 16px;
  padding: 12px 16px 14px; min-height: 96px;
}
.pilha-titulo { font-size: 0.85rem; font-weight: 700; color: var(--texto-suave); margin: 0 0 8px; }
.pilha-cartas { display: flex; flex-wrap: wrap; gap: 10px; }
.pilha-vazia { display: none; margin: 0; color: var(--texto-suave); font-size: 0.9rem; }
.pilha.vazia .pilha-vazia { display: block; }
.categorias { display: grid; gap: 14px; }
.categoria {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--azul-muito-palido); border: 3px dashed var(--azul-claro); border-radius: 16px;
  padding: 10px; min-height: 210px;
}
.categoria-nome { width: 100%; font-weight: 700; font-size: 1.15rem; background: var(--azul-palido); border-color: transparent; }
.categoria-cartas { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; flex: 1; }
.carta {
  position: relative; font-size: 1.25rem; min-height: 52px; padding: 8px 16px;
  background: var(--branco); border: 2px solid var(--azul-claro); border-radius: 12px; color: var(--texto);
  box-shadow: 0 2px 0 var(--azul-palido);
}
.carta-frase { font-size: 1.05rem; text-align: left; }
.carta-frase strong { color: var(--azul-escuro); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.carta.certo, .carta.mostrado { border-color: var(--verde); background: var(--verde-claro); padding-left: 38px; }
.carta.mostrado { border-style: dashed; }
.carta.certo::before, .carta.mostrado::before {
  content: "✓"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--verde); font-weight: 700;
}
.carta-grande { display: inline-block; font-size: 1.6rem; padding: 14px 26px; }
.classificar-uma { margin-bottom: 22px; }
.botao.principal:disabled, .botao.secundario:disabled, .botao.discreto:disabled { opacity: 0.45; }
.botao.principal:disabled { background: var(--azul-claro); border-color: var(--azul-claro); }

/* ---------- pares ---------- */

.pares-titulos, .pares-colunas { display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1fr); max-width: 980px; }
.pares-titulos { font-weight: 700; color: var(--texto-suave); margin-bottom: 8px; text-align: center; }
.pares-colunas { position: relative; }
.coluna { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; }
.elemento-par {
  min-height: 60px; font-size: 1.25rem; text-align: center;
  background: var(--branco); border: 3px solid var(--azul-claro); border-radius: 14px; color: var(--texto);
}
.elemento-par.escolhido { border-color: var(--amarelo); box-shadow: 0 0 0 4px var(--amarelo-claro); }
.elemento-par.ligado { border-color: var(--azul); background: var(--azul-palido); }
.elemento-par.mostrado { border-color: var(--verde); border-style: dashed; background: var(--verde-claro); }
.elemento-par:disabled { cursor: default; }
.pares-linhas { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.pares-linhas line.linha-certa { stroke: var(--azul); stroke-width: 4; stroke-linecap: round; }
.pares-linhas line.linha-mostrada { stroke: var(--verde); stroke-width: 4; stroke-dasharray: 9 7; stroke-linecap: round; }
.pares-linhas circle.linha-certa { fill: var(--azul); }
.pares-linhas circle.linha-mostrada { fill: var(--verde); }
.pares-contexto { font-size: 0.9rem; color: var(--texto-suave); margin-bottom: 4px; }
@media (max-width: 600px) {
  .pares-titulos, .pares-colunas { grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr); }
  .elemento-par { font-size: 1.05rem; padding: 8px; }
}

/* ---------- ordenar ---------- */

.lista-ordenar { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
.lista-ordenar.horizontal { flex-direction: row; flex-wrap: wrap; gap: 14px; }
.lugar { display: flex; align-items: center; gap: 10px; }
.lista-ordenar.horizontal .lugar { flex-direction: column; align-items: stretch; gap: 4px; }
.lugar-numero { min-width: 2.2em; font-weight: 700; color: var(--texto-suave); text-align: right; }
.lista-ordenar.horizontal .lugar-numero { text-align: center; min-width: 0; font-size: 0.85rem; }
.cartao-ordenar {
  position: relative; flex: 1; text-align: left; font-size: 1.2rem; min-height: 58px; padding: 10px 18px;
  background: var(--branco); border: 3px solid var(--azul-claro); border-radius: 14px; color: var(--texto);
  box-shadow: 0 2px 0 var(--azul-palido);
}
.lista-ordenar.horizontal .cartao-ordenar { text-align: center; min-width: 120px; }
.lista-ordenar.numeros .cartao-ordenar { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.cartao-ordenar.certo, .cartao-ordenar.mostrado { border-color: var(--verde); background: var(--verde-claro); padding-right: 40px; }
.cartao-ordenar.mostrado { border-style: dashed; }
.cartao-ordenar.certo::after, .cartao-ordenar.mostrado::after {
  content: "✓"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--verde); font-weight: 700;
}
.cartao-ordenar.escolhido { border-color: var(--azul); background: var(--azul-palido); }
.cartao-ordenar.fixo { cursor: default; }

/* ---------- lacunas ---------- */

.texto-lacunas {
  font-size: 1.35rem; line-height: 2.4; max-width: 980px; margin: 0 0 10px;
  background: var(--branco); border-radius: 14px; padding: 16px 24px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.lacuna { vertical-align: middle; margin: 0 3px; }
.lacuna-banco {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 128px; min-height: 50px; padding: 2px 4px; line-height: 1.2;
  background: var(--azul-muito-palido); border: 2px dashed var(--azul-claro); border-bottom: 4px solid var(--azul);
  border-radius: 10px;
}
.lacuna-banco .ficha { margin: 0; }
.lacuna-escrever { font-size: 1.3rem; min-height: 46px; padding: 2px 8px; text-align: center; line-height: 1.2; }
.lacuna-escolher {
  position: relative; display: inline-block; min-width: 2.4em; min-height: 46px; padding: 2px 6px; margin: 0 1px; line-height: 1.2;
  font-size: 1.3rem; font-weight: 700; color: var(--azul-escuro);
  background: var(--azul-muito-palido); border: 2px solid var(--azul-claro); border-bottom: 4px solid var(--azul); border-radius: 8px;
}
/* Espaço ainda vazio: uma seta mostra que se abre um menu. */
.lacuna-escolher.vazia::after { content: "▾"; font-size: 1rem; color: var(--azul); }
.lacuna.tentar { background: var(--amarelo-claro); border-color: var(--amarelo); }
.lacuna.certo, .lacuna.mostrado { background: var(--verde-claro); border-color: var(--verde); color: var(--texto); opacity: 1; }
.lacuna.mostrado { border-style: dashed; }
.lacuna.escolhido { background: var(--azul-palido); border-color: var(--azul); }
.lacuna-banco, .lacuna-escolher { position: relative; }
.lacuna-banco.certo::after, .lacuna-banco.mostrado::after, .lacuna-escolher.certo::after, .lacuna-escolher.mostrado::after {
  content: "✓"; position: absolute; top: -12px; right: -9px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--verde); color: var(--branco); font-size: 0.8rem; line-height: 22px; text-align: center; font-weight: 700;
}
.marca-certo { color: var(--verde); font-weight: 700; font-size: 1rem; vertical-align: middle; margin-right: 4px; }
.lacuna-resposta { font-weight: 700; color: var(--verde); padding: 0 10px; }
.banco-titulo { font-weight: 700; font-size: 0.85rem; color: var(--texto-suave); margin: 18px 0 6px; }
.banco-palavras {
  display: flex; flex-wrap: wrap; gap: 10px; min-height: 66px; max-width: 980px;
  padding: 10px; background: var(--branco); border: 2px dashed var(--azul-palido); border-radius: 14px;
}
.ficha {
  font-size: 1.2rem; min-height: 48px; padding: 6px 16px; line-height: 1.2;
  background: var(--branco); border: 2px solid var(--azul-claro); border-radius: 10px; color: var(--texto);
  box-shadow: 0 2px 0 var(--azul-palido);
}
.ficha.usada { display: none; }
.ficha.fixo { border-color: var(--verde); background: var(--verde-claro); }
.opcao-menu.tentado { display: none; }

/* ---------- marcar ---------- */

.frase-marcar {
  font-size: 1.5rem; line-height: 2.6; max-width: 980px; margin: 0 0 10px;
  background: var(--branco); border-radius: 14px; padding: 14px 22px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.palavra {
  position: relative; display: inline-flex; flex-direction: column-reverse; align-items: center; vertical-align: middle;
  font-size: 1.5rem; line-height: 1.25; min-height: 48px; padding: 4px 3px; margin: 0;
  background: transparent; border: 2px solid transparent; border-radius: 10px; color: var(--texto);
}
.palavra:hover:not(:disabled) { background: var(--azul-muito-palido); border-color: var(--azul-palido); }
.palavra.escolhido { background: var(--amarelo-claro); border-color: var(--amarelo); }
.palavra.certo, .palavra.mostrado { background: var(--verde-claro); border-color: var(--verde); }
.palavra.mostrado { border-style: dashed; }
.palavra.certo::after, .palavra.mostrado::after {
  content: "✓"; position: absolute; top: -11px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--verde); color: var(--branco); font-size: 0.75rem; line-height: 20px; text-align: center; font-weight: 700;
}
.palavra.errado-marca .palavra-texto { text-decoration: line-through; text-decoration-color: var(--laranja); text-decoration-thickness: 3px; }
.com-segmentos .palavra { border: 2px dashed var(--azul-claro); padding: 4px 14px; margin: 0 4px; }
/* Compensa o espaço interior dos botões (3 px + 2 px de borda). */
.frase-marcar:not(.com-segmentos) .pontuacao-antes { margin-left: -5px; }
.frase-marcar:not(.com-segmentos) .pontuacao-depois { margin-right: -5px; }
.etiqueta-palavra {
  font-size: 0.75rem; font-weight: 700; line-height: 1.4; margin-top: 2px;
  color: var(--azul-escuro); background: var(--azul-palido); border-radius: 6px; padding: 0 6px;
}
.opcao-tirar { color: var(--texto-suave); }

/* ---------- texto ---------- */

[data-tipo="texto"] .app { max-width: 1320px; }
[data-tipo="texto"] .retorno.visivel { max-width: 1296px; }
.leitura { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px; align-items: start; }
.folha-leitura {
  background: var(--branco); border-radius: 16px; padding: 22px 28px 20px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); border-top: 6px solid var(--azul-claro);
  font-size: 1.05rem; line-height: 1.7;
}
.folha-leitura:focus { outline: none; }
.folha-leitura p { margin: 0 0 0.6em; }
.folha-leitura p:last-child { margin-bottom: 0; }
.leitura-titulo { font-size: 1.4rem; color: var(--azul-escuro); margin: 0 0 0.6em; }
.leitura-pergunta { position: sticky; top: 12px; }
.leitura-pergunta .pergunta { font-size: 1.3rem; margin-bottom: 18px; }
.leitura-pergunta .escolhas { grid-template-columns: minmax(0, 1fr); }
.leitura-pergunta .escolhas-vf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.leitura-pergunta .opcao { font-size: 1.2rem; text-align: left; }
.leitura-pergunta .escolhas-vf .opcao { text-align: center; }
.leitura-pergunta .afirmacao { font-size: 1.3rem; }
.leitura-pergunta .texto-lacunas { font-size: 1.25rem; }
.leitura-pergunta .pares-titulos, .leitura-pergunta .pares-colunas { grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); }
.leitura-pergunta .elemento-par { font-size: 1.1rem; padding: 8px 10px; }
.leitura-pergunta .cartao-ordenar { font-size: 1.1rem; }

.unidade { border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.folha-leitura.a-provar { border-top-color: var(--amarelo); box-shadow: 0 0 0 4px var(--amarelo-claro), 0 1px 3px rgba(22, 64, 122, 0.10); }
.a-provar .unidade[role="button"] { cursor: pointer; background: var(--azul-muito-palido); box-shadow: 0 0 0 2px var(--azul-muito-palido); }
.a-provar .unidade[role="button"]:hover { background: var(--amarelo-claro); box-shadow: 0 0 0 2px var(--amarelo); }
.a-provar .unidade[role="button"]:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
.pedido-prova {
  margin: 18px 0 0; padding: 12px 16px; font-size: 1.2rem; font-weight: 700; color: var(--amarelo-texto);
  background: var(--amarelo-claro); border-left: 6px solid var(--amarelo); border-radius: 12px;
}
.pedido-prova::before { content: "← "; }
@media (max-width: 980px) { .pedido-prova::before { content: "↑ "; } }
.unidade.prova-tentada { color: var(--cinzento); text-decoration: underline dashed var(--cinzento); text-underline-offset: 4px; }
.unidade.prova-certa, .unidade.prova-mostrada { background: var(--verde-claro); box-shadow: 0 0 0 2px var(--verde); color: var(--texto); }
.unidade.prova-mostrada { box-shadow: 0 0 0 2px var(--verde-claro); text-decoration: underline dashed var(--verde); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.unidade.prova-certa::after, .unidade.prova-mostrada::after { content: " ✓"; color: var(--verde); font-weight: 700; }

.genero-noticia { border-top-color: var(--texto); }
.genero-noticia .leitura-titulo { font-size: 1.55rem; color: var(--texto); border-bottom: 2px solid var(--texto); padding-bottom: 8px; }
.bloco-local { font-size: 0.9rem; color: var(--texto-suave); }
.genero-noticia .bloco-local { text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; margin-bottom: 0.4em; }
.bloco-entrada { font-weight: 700; }
.genero-carta { background: var(--papel); }
.genero-carta .bloco-local { text-align: right; font-size: 1rem; margin-bottom: 1em; }
.genero-carta .bloco-despedida { margin-top: 1.1em; margin-bottom: 0; text-align: right; }
.genero-carta .bloco-assinatura { text-align: right; font-style: italic; font-size: 1.25rem; }
.genero-convite { border: 4px dashed var(--amarelo); text-align: center; background: var(--papel); }
.genero-convite .leitura-titulo { font-size: 1.6rem; }
.genero-convite .bloco-assinatura { margin-top: 1em; font-style: italic; }
.genero-dialogo .bloco-paragrafo { padding-left: 1.3em; text-indent: -1.3em; }
.genero-poema { padding-left: 44px; }
.estrofe { margin-bottom: 1.3em !important; }
.verso { display: block; width: -moz-fit-content; width: fit-content; padding: 0 6px; margin-left: -6px; }
.vinhetas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vinheta {
  position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 130px;
  padding: 12px 12px 12px; background: var(--azul-muito-palido); border: 3px solid var(--texto); border-radius: 6px;
  font-size: 1rem; line-height: 1.45;
}
.vinheta-numero {
  position: absolute; top: -3px; left: -3px; min-width: 26px; height: 26px; padding: 0 6px;
  background: var(--texto); color: var(--branco); font-size: 0.8rem; font-weight: 700; line-height: 26px; text-align: center; border-radius: 6px 0 6px 0;
}
.vinheta p { margin: 0; }
.legenda-bd { margin: 0 0 0 26px !important; padding: 4px 10px; background: var(--amarelo-claro); border: 2px solid var(--amarelo); border-radius: 4px; }
.vinheta > .fala:first-of-type:not(.legenda-bd + .fala) { margin-top: 18px; }
.fala { align-self: flex-start; max-width: 92%; padding: 6px 14px 8px; background: var(--branco); border: 2px solid var(--texto); border-radius: 18px 18px 18px 4px; }
.fala-direita { align-self: flex-end; border-radius: 18px 18px 4px 18px; }
.fala-quem { display: block; font-size: 0.75rem; font-weight: 700; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 0.04em; }

@media (max-width: 980px) {
  .leitura { grid-template-columns: minmax(0, 1fr); }
  .leitura-pergunta { position: static; }
}
@media (max-width: 600px) {
  .vinhetas { grid-template-columns: minmax(0, 1fr); }
  .folha-leitura { padding: 16px 16px 14px; }
}

/* ---------- ditado ---------- */

.ditado-cabeca { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.ditado-numero {
  font-weight: 700; font-size: 1.15rem; white-space: nowrap;
  background: var(--azul); color: var(--branco); border-radius: 999px; padding: 6px 20px;
}
.ditado-pedido { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.15rem; color: var(--azul-escuro); }
.ditado-pedido .icone { width: 32px; height: 32px; color: var(--azul); }
.ditado-zona { max-width: 1040px; margin-bottom: 6px; }
.ditado-zona .campo-com-acentos { display: flex; width: 100%; }
.campo-ditado { width: 100%; font-size: 1.5rem; min-height: 66px; padding: 10px 18px; }
.frase-ditado {
  font-size: 1.5rem; line-height: 1.5; max-width: 1040px; margin: 0 0 10px;
  background: var(--branco); border-radius: 14px; padding: 18px 24px 12px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.frase-ditado.certa { border-left: 8px solid var(--verde); padding-bottom: 18px; }
.frase-ditado.certa .marca-certo { font-size: 1.3rem; margin-right: 10px; }
.palavra-ditado { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; min-height: 64px; }
.palavra-ditado.certa { color: var(--texto); }
.frase-ditado.com-lacunas { color: var(--texto-suave); }
.frase-ditado.com-lacunas .palavra-ditado.certa { color: var(--texto); }
.campo-palavra { font-size: 1.35rem; min-height: 46px; padding: 2px 6px; text-align: center; border-radius: 10px; }
.campo-sinal { width: 3ch; padding: 2px; }
.palavra-ditado.sublinhada .campo-palavra { border-color: var(--laranja); border-bottom-width: 4px; background: var(--laranja-claro); }
.palavra-ditado.aberta .campo-palavra:focus { background: var(--papel); }
.categoria-erro { font-size: 0.72rem; font-weight: 700; color: var(--laranja); line-height: 1.2; margin-top: 3px; white-space: nowrap; }
.palavra-ditado.mostrada .palavra-certa {
  color: var(--verde); font-weight: 700; border-bottom: 3px dashed var(--verde); line-height: 1.4; padding: 0 2px;
}
.palavra-tua { font-size: 0.8rem; color: var(--texto-suave); text-decoration: line-through; line-height: 1.3; margin-top: 2px; }
.fim-rever { margin: 4px auto 14px; max-width: 520px; }
.fim-rever-titulo { font-weight: 700; color: var(--azul-escuro); margin-bottom: 6px; }
.fim-rever-lista { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.fim-rever-lista li {
  font-size: 1.15rem; font-weight: 700; padding: 4px 14px; border-radius: 10px;
  background: var(--amarelo-claro); color: var(--amarelo-texto); border: 2px solid var(--amarelo);
}
.adulto-rever { margin: 0 0 6px; }

/* ---------- escuta ---------- */

.escuta-cartao {
  display: flex; gap: 18px; align-items: flex-start; max-width: 1000px; margin-bottom: 20px;
  background: var(--azul-muito-palido); border: 2px solid var(--azul-palido); border-left: 8px solid var(--azul);
  border-radius: 16px; padding: 16px 22px;
}
.escuta-icone { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--azul); color: var(--branco); display: flex; align-items: center; justify-content: center; }
.escuta-icone .icone { width: 34px; height: 34px; }
.escuta-corpo { flex: 1; }
.escuta-pedido { font-size: 1.15rem; font-weight: 700; color: var(--azul-escuro); margin-bottom: 4px; }
.escuta-titulo { font-size: 1.25rem; margin-bottom: 8px; }
.escuta-objetivo-rotulo { font-size: 0.85rem; font-weight: 700; color: var(--texto-suave); margin: 0; text-transform: uppercase; letter-spacing: 0.04em; }
.escuta-objetivo { font-size: 1.15rem; background: var(--amarelo-claro); border-radius: 10px; padding: 6px 12px; display: inline-block; margin: 2px 0 10px; }
.escuta-outra-vez { font-size: 0.95rem; color: var(--azul-escuro); font-weight: 700; margin: 4px 0 0; }
.botao-ouvir { margin-top: 2px; }
.ficha-registo { border-collapse: separate; border-spacing: 0 10px; width: 100%; max-width: 1000px; }
.ficha-registo caption { text-align: left; font-weight: 700; color: var(--texto-suave); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }
.ficha-registo th, .ficha-registo td { background: var(--branco); padding: 10px 16px; vertical-align: middle; }
.ficha-registo th { width: 30%; text-align: left; font-size: 1.2rem; color: var(--azul-escuro); border-radius: 14px 0 0 14px; border-left: 6px solid var(--azul-claro); }
.ficha-registo td { border-radius: 0 14px 14px 0; }
.ficha-registo tr.certo th { border-left-color: var(--verde); }
.ficha-registo tr.mostrado th { border-left-color: var(--verde); border-left-style: dashed; }
.escolhas-registo { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; max-width: none; }
.escolhas-registo .opcao { min-height: 52px; font-size: 1.15rem; padding: 8px 12px; }
.escolhas-registo .opcao.certo, .escolhas-registo .opcao.mostrado { padding-left: 40px; }
.escolhas-registo .opcao.certo::before, .escolhas-registo .opcao.mostrado::before { left: 12px; }
.campo-registo { width: 100%; max-width: 420px; font-size: 1.25rem; }
.escuta-lembrete { display: flex; align-items: center; gap: 10px; color: var(--texto-suave); font-size: 0.95rem; margin: 10px 0 14px; }
.escuta-lembrete .icone { color: var(--azul); }
@media (max-width: 700px) {
  .ficha-registo, .ficha-registo tbody, .ficha-registo tr, .ficha-registo th, .ficha-registo td { display: block; width: 100%; }
  .ficha-registo th { border-radius: 14px 14px 0 0; }
  .ficha-registo td { border-radius: 0 0 14px 14px; border-left: 6px solid var(--azul-claro); }
}

/* ---------- frase ---------- */

.frase-base {
  max-width: 980px; margin: 0 0 16px; background: var(--branco); border-radius: 14px;
  border-left: 8px solid var(--azul-claro); padding: 10px 20px 12px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.frase-base-rotulo { display: block; font-size: 0.8rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.04em; }
.frase-base p { font-size: 1.45rem; margin: 2px 0 0; }
.frase-linha {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 980px; min-height: 84px;
  background: var(--branco); border: 3px dashed var(--azul-claro); border-bottom: 5px solid var(--azul);
  border-radius: 16px; padding: 12px 16px; margin-bottom: 4px;
}
.frase-vazia { color: var(--texto-suave); font-size: 1rem; }
.frase-linha.tentar { border-color: var(--amarelo); background: var(--amarelo-claro); }
.frase-linha.certo, .frase-linha.mostrado { border-color: var(--verde); border-style: solid; background: var(--verde-claro); }
.frase-linha.mostrado { border-style: dashed; }
.frase-linha.escolhido { border-color: var(--azul); border-style: solid; background: var(--azul-palido); }
.frase-banco {
  display: flex; flex-wrap: wrap; gap: 10px; min-height: 70px; max-width: 980px;
  padding: 10px; background: var(--azul-muito-palido); border-radius: 14px;
}
.peca-frase {
  min-width: 54px;
  font-size: 1.35rem; min-height: 54px; padding: 6px 18px; line-height: 1.2;
  background: var(--branco); border: 2px solid var(--azul-claro); border-radius: 12px; color: var(--texto);
  box-shadow: 0 2px 0 var(--azul-palido);
}
.frase-linha .peca-frase { border-color: var(--azul); }
.frase-linha.certo .peca-frase, .frase-linha.mostrado .peca-frase { border-color: var(--verde); }
.peca-frase:disabled { cursor: default; }

/* ---------- silabas ---------- */

.silabas-palavra {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 92px;
  font-size: 2.6rem; font-weight: 700; letter-spacing: 0.02em; color: var(--azul-escuro);
  background: var(--branco); border-radius: 18px; padding: 10px 30px; margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10);
}
.silabas-hifen { color: var(--azul-claro); font-weight: 400; }
.silaba { padding: 0 6px; border-radius: 10px; }
.silaba.tonica { background: var(--amarelo-claro); box-shadow: inset 0 -5px 0 var(--amarelo); }
.silaba-botao {
  font-size: 2.4rem; font-weight: 700; min-height: 72px; min-width: 72px; padding: 4px 16px;
  color: var(--azul-escuro); background: var(--azul-muito-palido); border: 3px solid var(--azul-claro); border-radius: 14px;
}
.silaba-botao.tentado { border-style: dashed; border-color: var(--cinzento); color: var(--cinzento); background: var(--cinzento-claro); }
.silabas-feitas { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 4px; }
.silabas-feitas li { display: flex; align-items: center; gap: 6px; font-size: 1.05rem; color: var(--texto); }
.silabas-feitas li.mostrado .marca-certo { opacity: 0.6; }
.silabas-zona { max-width: 980px; }
.silabas-letras {
  display: inline-flex; align-items: stretch; flex-wrap: wrap; background: var(--branco);
  border: 3px solid var(--azul-palido); border-radius: 18px; padding: 10px 14px; margin-bottom: 4px;
}
.silabas-letras.tentar { border-color: var(--amarelo); background: var(--amarelo-claro); }
.letra { font-size: 2.6rem; font-weight: 700; color: var(--azul-escuro); min-width: 0.7em; text-align: center; line-height: 72px; }
.corte {
  min-height: 72px; min-width: 36px; width: 36px; padding: 0; margin: 0 1px;
  background: transparent; border: 2px dashed transparent; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.corte:hover:not(:disabled) { background: var(--azul-muito-palido); border-color: var(--azul-claro); }
.corte-traco { display: block; width: 5px; height: 0; border-radius: 3px; background: var(--laranja); transition: height 120ms; }
.corte.cortado .corte-traco { height: 56px; }
.escolhas-silabas { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 980px; }
@media (max-width: 900px) { .escolhas-silabas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- detetive ---------- */

.detetive-cabeca { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; max-width: 1000px; }
.detetive-robo { width: 52px; height: 52px; border-radius: 50%; background: var(--amarelo-claro); color: var(--amarelo-texto); display: flex; align-items: center; justify-content: center; border: 2px solid var(--amarelo); }
.detetive-robo .icone { width: 30px; height: 30px; }
.detetive-pedido { flex: 1; margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--azul-escuro); }
.detetive-contagem { margin: 0; font-weight: 700; color: var(--texto-suave); background: var(--branco); border-radius: 999px; padding: 4px 16px; }
.detetive-folha {
  max-width: 1000px; background: var(--branco); border-radius: 16px; padding: 16px 22px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); border-top: 6px solid var(--amarelo);
}
.detetive-texto-corrido { font-size: 1.5rem; line-height: 2.5; margin: 0; }
.detetive-palavra {
  position: relative; display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle;
  font-size: 1.5rem; line-height: 1.25; min-height: 48px; padding: 4px 4px; margin: 0;
  background: transparent; border: 2px solid transparent; border-radius: 10px; color: var(--texto);
}
.detetive-palavra:hover:not(:disabled), .detetive-linha:hover:not(:disabled) { background: var(--amarelo-claro); border-color: var(--amarelo); }
.detetive-palavra.verificada, .detetive-linha.verificada { color: var(--texto-suave); background: var(--cinzento-claro); border-color: transparent; }
.detetive-palavra.a-corrigir, .detetive-linha.a-corrigir { background: var(--laranja-claro); border-color: var(--laranja); }
.detetive-palavra.resolvido, .detetive-linha.resolvido { background: var(--verde-claro); border-color: var(--verde); color: var(--texto); font-weight: 700; }
.detetive-palavra.mostrado, .detetive-linha.mostrado { border-style: dashed; }
.detetive-antes { font-size: 0.75rem; font-weight: 400; color: var(--texto-suave); text-decoration: line-through; line-height: 1.2; }
.detetive-linhas { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.detetive-linha {
  width: 100%; text-align: left; font-size: 1.45rem; min-height: 60px; padding: 8px 18px;
  background: var(--papel); border: 2px solid var(--azul-palido); border-radius: 12px; color: var(--texto);
  display: flex; flex-direction: column; align-items: flex-start;
}
.detetive-linha .detetive-antes { font-size: 0.85rem; }
.detetive-correcao { max-width: 1000px; margin-top: 16px; }
.detetive-correcao:empty { display: none; }
.detetive-pergunta { margin-bottom: 12px; }
.detetive-errado { color: var(--laranja); }
.campo-detetive { width: 100%; max-width: 520px; font-size: 1.4rem; }
.detetive-linha-edicao { font-size: 1.5rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--branco); border-radius: 12px; padding: 8px 18px; margin: 0 0 10px; }
.campo-na-linha { font-size: 1.45rem; text-align: center; }
.detetive-espaco { display: inline-block; min-width: 3ch; text-align: center; border-bottom: 4px solid var(--laranja); color: var(--laranja); font-weight: 700; }

/* ---------- memoria ---------- */

.memoria-cabeca { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 980px; margin-bottom: 12px; }
.memoria-legenda { display: flex; align-items: center; gap: 8px; }
.memoria-chip { font-size: 0.9rem; font-weight: 700; border-radius: 999px; padding: 3px 14px; }
.memoria-chip.lado-e { background: var(--azul-palido); color: var(--azul-escuro); }
.memoria-chip.lado-d { background: var(--amarelo-claro); color: var(--amarelo-texto); }
.memoria-mais { font-weight: 700; color: var(--texto-suave); }
.memoria-contador { font-size: 0.95rem; color: var(--texto-suave); }
.memoria-grelha { display: grid; gap: 14px; max-width: 980px; }
.memoria-carta {
  position: relative; min-height: 118px; padding: 0; border-radius: 16px; overflow: hidden;
  border: 3px solid var(--azul); background: var(--azul); color: var(--texto);
  box-shadow: 0 3px 0 var(--azul-escuro);
}
.memoria-verso {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 50%, var(--papel) 0 12%, transparent 13%),
    radial-gradient(circle at 0 0, var(--azul-claro) 0 22%, transparent 23%),
    radial-gradient(circle at 100% 0, var(--azul-claro) 0 22%, transparent 23%),
    radial-gradient(circle at 0 100%, var(--azul-claro) 0 22%, transparent 23%),
    radial-gradient(circle at 100% 100%, var(--azul-claro) 0 22%, transparent 23%),
    var(--azul);
}
.memoria-frente {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  padding: 10px 12px; background: var(--branco); font-size: 1.3rem; line-height: 1.25; text-align: center;
}
.memoria-carta.lado-d .memoria-frente { background: var(--amarelo-claro); }
.memoria-carta.aberta .memoria-frente { display: flex; animation: virar 220ms ease-out; }
.memoria-carta.aberta { border-color: var(--azul-claro); box-shadow: 0 3px 0 var(--azul-palido); }
.memoria-carta.lado-d.aberta { border-color: var(--amarelo); }
.memoria-carta:hover:not(:disabled):not(.aberta) { transform: translateY(-2px); }
.memoria-carta.aberta.encontrada, .memoria-carta.aberta.mostrada { border-color: var(--verde); }
.memoria-carta.mostrada { border-style: dashed; }
.memoria-carta.encontrada::after, .memoria-carta.mostrada::after {
  content: "✓"; position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--verde); color: var(--branco); font-size: 0.8rem; line-height: 22px; text-align: center; font-weight: 700; z-index: 1;
}
.memoria-carta:disabled { cursor: default; }
@keyframes virar { from { transform: scaleX(0.2); opacity: 0.4; } to { transform: scaleX(1); opacity: 1; } }
@media (max-width: 700px) { .memoria-grelha { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }

/* ---------- bingo ---------- */

.bingo { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 28px; align-items: start; max-width: 1040px; }
.bingo-cabeca { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
.bingo-contagem { font-weight: 700; color: var(--texto-suave); font-size: 0.95rem; }
.bingo-pergunta-texto {
  margin: 0; font-size: 2rem; font-weight: 700; color: var(--azul-escuro); text-align: center;
  background: var(--branco); border-radius: 18px; padding: 26px 18px; border-top: 8px solid var(--amarelo);
  box-shadow: var(--sombra); min-height: 120px; display: flex; align-items: center; justify-content: center;
}
.bingo-tabuleiro { position: relative; max-width: 560px; }
.bingo-grelha { display: grid; gap: 10px; background: var(--azul); padding: 12px; border-radius: 20px; }
.bingo-casa {
  position: relative; aspect-ratio: 1 / 1; min-height: 76px; padding: 6px; border-radius: 14px;
  background: var(--papel); border: 2px solid var(--azul-claro); color: var(--texto);
  font-size: 1.45rem; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center;
}
.bingo-grelha.lado-4 .bingo-casa { font-size: 1.2rem; }
.bingo-casa:hover:not(:disabled) { background: var(--amarelo-claro); border-color: var(--amarelo); }
.bingo-casa.tentada { border-style: dashed; border-color: var(--cinzento); color: var(--cinzento); background: var(--cinzento-claro); }
.bingo-casa.coberta { background: var(--azul-palido); color: var(--azul-escuro); }
.bingo-carimbo { display: none; }
.bingo-casa.coberta .bingo-carimbo {
  display: block; position: absolute; inset: 14%; border-radius: 50%;
  border: 5px solid var(--azul); opacity: 0.35; animation: pousar 260ms ease-out;
}
.bingo-casa.mostrada .bingo-carimbo { border-style: dashed; border-color: var(--verde); opacity: 0.6; }
.bingo-casa.na-linha { background: var(--amarelo-claro); border-color: var(--amarelo); }
.bingo-casa:disabled { cursor: default; }
.bingo-festa {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.6); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 12px; padding: 14px 30px; border-radius: 999px;
  background: var(--amarelo); color: var(--azul-escuro); font-size: 2.2rem; font-weight: 800; box-shadow: var(--sombra);
}
.bingo-festa.ver { animation: bingo 1600ms ease-out; }
.andorinha-bingo { width: 64px; height: 40px; }
@keyframes bingo {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
@media (max-width: 800px) { .bingo { grid-template-columns: minmax(0, 1fr); } .bingo-cabeca { position: static; } }

/* ---------- labirinto ---------- */

.labirinto-regra {
  display: inline-block; font-size: 1.3rem; font-weight: 700; color: var(--azul-escuro);
  background: var(--amarelo-claro); border: 2px solid var(--amarelo); border-radius: 14px; padding: 8px 20px; margin-bottom: 16px;
}
.labirinto { display: grid; grid-template-columns: 96px minmax(0, 560px) 96px; align-items: stretch; gap: 8px; }
.labirinto:has(.lado-6) { grid-template-columns: 96px minmax(0, 700px) 96px; }
.labirinto-grelha.lado-6 .labirinto-casa { aspect-ratio: auto; min-height: 74px; }
.labirinto-grelha.lado-6 .labirinto-casa { font-size: 1.15rem; }
.labirinto-casa.comprido { font-size: 1.05rem; }
.labirinto-grelha.lado-6 .labirinto-casa.comprido { font-size: 0.92rem; }
.labirinto-texto { white-space: nowrap; }
.labirinto-lado { display: grid; }
.labirinto-porta { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; color: var(--azul-escuro); font-size: 0.95rem; }
.labirinto-porta .seta { font-size: 2rem; line-height: 1; color: var(--azul); }
.labirinto-porta.saida.chegou { color: var(--verde); }
.labirinto-grelha { display: grid; gap: 6px; background: var(--azul-escuro); padding: 8px; border-radius: 16px; }
.labirinto-casa {
  position: relative; aspect-ratio: 1 / 1; min-height: 64px; padding: 4px; border-radius: 10px;
  background: var(--azul-palido); border: 2px solid transparent; color: var(--azul-escuro);
  font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.1;
}
.labirinto-casa:disabled { cursor: default; }
.labirinto-casa.pode { background: var(--papel); border-color: var(--amarelo); box-shadow: 0 0 0 3px var(--amarelo-claro); }
.labirinto-casa.pode:hover { background: var(--amarelo-claro); }
.labirinto-casa.visitada { background: var(--verde-claro); border-color: var(--verde); }
.labirinto-casa.visitada.mostrada { border-style: dashed; }
.labirinto-casa.cinzenta { background: var(--cinzento-claro); color: var(--cinzento); border-color: transparent; text-decoration: line-through; text-decoration-thickness: 2px; }
.labirinto-casa.atual { box-shadow: 0 0 0 4px var(--amarelo); }
.labirinto-marca { pointer-events: none; }
.andorinha-labirinto { width: 40px; height: 26px; }
@media (max-width: 760px) { .labirinto { grid-template-columns: 54px minmax(0, 1fr) 54px; } .labirinto-casa { font-size: 1.05rem; } }

/* ---------- mensagem ---------- */

.mensagem-quadro {
  display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; max-width: 1000px; margin-bottom: 6px;
  background: var(--azul-escuro); border-radius: 18px; padding: 16px 20px;
}
.mensagem-palavra { display: flex; gap: 6px; align-items: center; }
.mensagem-letra {
  width: 48px; height: 58px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: var(--azul); border: 2px solid var(--azul-claro); color: var(--branco); font-size: 1.8rem; font-weight: 800;
}
.mensagem-letra:empty::before { content: "?"; color: var(--azul-claro); font-weight: 700; }
.mensagem-letra.revelada { background: var(--papel); color: var(--azul-escuro); border-color: var(--papel); }
.mensagem-letra.esta { background: var(--amarelo); border-color: var(--amarelo-claro); box-shadow: 0 0 0 4px rgba(224, 170, 46, 0.35); }
.mensagem-letra.esta:empty::before { color: var(--azul-escuro); }
.mensagem-letra.agora { animation: pousar 360ms ease-out; background: var(--amarelo-claro); }
.mensagem-sinal { color: var(--papel); font-size: 1.8rem; font-weight: 800; }
.mensagem-dica { font-size: 0.9rem; color: var(--texto-suave); margin-bottom: 14px; }
.mensagem-resposta { margin-bottom: 8px; }

/* ---------- quem_sou ---------- */

.quem-cartao {
  max-width: 900px; background: var(--branco); border-radius: 18px; padding: 16px 24px 14px; margin-bottom: 18px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); border-left: 8px solid var(--amarelo);
}
.quem-titulo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 800; color: var(--azul-escuro); margin-bottom: 8px; }
.quem-icone { width: 40px; height: 40px; border-radius: 50%; background: var(--amarelo); color: var(--azul-escuro); display: flex; align-items: center; justify-content: center; }
.quem-pistas { margin: 0 0 10px; padding-left: 1.6em; display: flex; flex-direction: column; gap: 6px; }
.quem-pista { font-size: 1.3rem; }
.quem-pista.nova { animation: subir 260ms ease-out; }
.quem-pista.fechada { color: var(--texto-suave); font-size: 1rem; list-style: none; margin-left: -1.6em; padding: 4px 12px; background: var(--cinzento-claro); border-radius: 8px; width: fit-content; }
.quem-resposta { max-width: 900px; }
.quem-estrelas { display: flex; align-items: center; gap: 4px; margin-top: 14px; font-weight: 700; color: var(--azul-escuro); }
.quem-estrelas:empty { display: none; }
.quem-estrelas .estrela .icone { width: 30px; height: 30px; color: var(--cinzento); }
.quem-estrelas .estrela.cheia .icone { color: var(--amarelo); fill: var(--amarelo); }
.quem-estrelas > span:last-child { margin-left: 8px; }

/* ---------- intruso ---------- */

.intruso-cartas { display: grid; gap: 16px; max-width: 980px; margin-bottom: 22px; }
.intruso-carta {
  position: relative; min-height: 110px; font-size: 1.6rem; font-weight: 700; color: var(--azul-escuro);
  background: var(--branco); border: 3px solid var(--azul-claro); border-radius: 18px; box-shadow: 0 3px 0 var(--azul-palido);
}
.intruso-carta:hover:not(:disabled) { border-color: var(--azul); background: var(--azul-muito-palido); }
.intruso-carta.tentado { border-style: dashed; border-color: var(--cinzento); color: var(--cinzento); background: var(--cinzento-claro); }
.intruso-carta.o-intruso { border-color: var(--laranja); background: var(--laranja-claro); color: var(--texto); transform: rotate(-2deg); }
.intruso-carta.o-intruso.mostrado { border-style: dashed; }
.intruso-carta.o-intruso::after {
  content: "✓"; position: absolute; top: -12px; right: -10px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--verde); color: var(--branco); font-size: 0.9rem; line-height: 26px; text-align: center;
}
.intruso-carta.escolhido { border-color: var(--azul); background: var(--azul-palido); }
.intruso-carta:disabled { cursor: default; }
.intruso-razao { max-width: 980px; }
.escolhas-razoes .opcao { text-align: left; font-size: 1.2rem; }
@media (max-width: 700px) { .intruso-cartas { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }

/* ---------- cruzadas ---------- */

.cruzadas { display: grid; grid-template-columns: auto minmax(280px, 1fr); gap: 28px; align-items: start; }
.cruzadas-esquerda { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.cruzadas-grelha { display: grid; gap: 3px; padding: 6px; background: transparent; }
.cruzadas-casa { position: relative; width: 46px; height: 46px; }
.cruzadas-letra {
  width: 100%; height: 100%; padding: 0; text-align: center; font: inherit; font-size: 1.45rem; font-weight: 800; text-transform: uppercase;
  color: var(--azul-escuro); background: var(--branco); border: 2px solid var(--azul); border-radius: 6px; caret-color: var(--amarelo);
}
.cruzadas-letra:focus { outline: none; background: var(--amarelo-claro); border-color: var(--amarelo); box-shadow: 0 0 0 3px var(--amarelo); }
.cruzadas-casa.selecionada .cruzadas-letra { background: var(--azul-palido); }
.cruzadas-casa.selecionada .cruzadas-letra:focus { background: var(--amarelo-claro); }
.cruzadas-casa.tentar .cruzadas-letra { background: var(--amarelo-claro); border-color: var(--amarelo); }
.cruzadas-casa.certa .cruzadas-letra { background: var(--verde-claro); border-color: var(--verde); color: var(--verde); }
.cruzadas-casa.mostrada .cruzadas-letra { background: var(--verde-claro); border-color: var(--verde); border-style: dashed; color: var(--verde); }
.cruzadas-casa.dada .cruzadas-letra { color: var(--amarelo-texto); }
.cruzadas-numero { position: absolute; top: 2px; left: 4px; font-size: 0.6rem; font-weight: 700; color: var(--texto-suave); pointer-events: none; }
.cruzadas-painel { position: sticky; top: 12px; }
.cruzadas-atual { font-size: 1.2rem; background: var(--branco); border-left: 6px solid var(--amarelo); border-radius: 10px; padding: 8px 14px; margin-bottom: 4px; }
.cruzadas-pistas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 14px; }
.cruzadas-bloco h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-suave); margin-bottom: 4px; }
.cruzadas-lista { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.cruzadas-pista {
  width: 100%; text-align: left; display: flex; gap: 8px; align-items: baseline; font-size: 1.05rem; min-height: 44px; padding: 6px 12px;
  background: var(--branco); border: 2px solid transparent; border-radius: 10px; color: var(--texto);
}
.cruzadas-pista.selecionada { border-color: var(--amarelo); background: var(--amarelo-claro); }
.cruzadas-pista.certa, .cruzadas-pista.mostrada { color: var(--texto-suave); text-decoration: line-through; text-decoration-color: var(--verde); }
.cruzadas-n { font-weight: 800; color: var(--azul-escuro); min-width: 1.6em; }
@media (max-width: 900px) { .cruzadas { grid-template-columns: minmax(0, 1fr); } .cruzadas-painel { position: static; } }
@media (max-width: 600px) { .cruzadas-casa { width: 34px; height: 34px; } .cruzadas-letra { font-size: 1.1rem; } }

/* ---------- sopa ---------- */

.sopa { display: grid; grid-template-columns: minmax(0, 560px) minmax(260px, 1fr); gap: 28px; align-items: start; }
.sopa-grelha { display: grid; gap: 2px; background: var(--branco); border-radius: 16px; padding: 10px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); }
.sopa-letra {
  aspect-ratio: 1 / 1; min-height: 0; min-width: 0; padding: 0; border-radius: 8px; border: 2px solid transparent;
  background: transparent; color: var(--azul-escuro); font-size: 1.35rem; font-weight: 800;
}
.sopa-letra:hover:not(:disabled) { background: var(--azul-muito-palido); border-color: var(--azul-palido); }
.sopa-letra.primeira { background: var(--amarelo); color: var(--azul-escuro); border-color: var(--amarelo-texto); }
.sopa-letra.achada { background: var(--verde-claro); color: var(--verde); }
.sopa-letra.achada.mostrada { border-style: dashed; border-color: var(--verde); }
.sopa-painel { position: sticky; top: 12px; }
.sopa-titulo { font-weight: 700; color: var(--texto-suave); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
.sopa-contagem { font-weight: 700; color: var(--azul-escuro); margin: 2px 0 8px; }
.sopa-pistas { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.sopa-pista {
  width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 1.05rem; min-height: 48px; padding: 8px 14px;
  background: var(--branco); border: 2px solid var(--azul-palido); border-radius: 12px; color: var(--texto);
}
.sopa-pista.ativa { border-color: var(--amarelo); background: var(--amarelo-claro); }
.sopa-pista.certa, .sopa-pista.mostrada { border-color: var(--verde); background: var(--verde-claro); }
.sopa-pista.mostrada { border-style: dashed; }
.sopa-pista:disabled { cursor: default; }
.sopa-palavra { font-weight: 800; color: var(--azul-escuro); letter-spacing: 0.06em; }
.sopa-encontrada { font-weight: 800; color: var(--verde); letter-spacing: 0.06em; }
.sopa-encontrada:empty { display: none; }
.sopa-pista.certa .sopa-palavra, .sopa-pista.mostrada .sopa-palavra { display: none; }
@media (max-width: 900px) { .sopa { grid-template-columns: minmax(0, 1fr); } .sopa-painel { position: static; } }

/* ---------- cenario ---------- */

.cenario-historia { max-width: 900px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.cenario-passado { font-size: 0.95rem; color: var(--texto-suave); border-left: 4px solid var(--azul-palido); padding: 2px 12px; }
.cenario-passado p { margin: 0; }
.cenario-passado-escolha { display: flex; gap: 6px; color: var(--verde); font-weight: 600; }
.cenario-zona { max-width: 900px; }
.cenario-cena {
  background: var(--branco); border-radius: 16px; padding: 14px 22px; margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); border-left: 8px solid var(--azul);
}
.cenario-numero { display: inline-block; font-size: 0.8rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.04em; }
.cenario-texto { font-size: 1.35rem; margin: 4px 0 0; }
.escolhas-cenario .opcao { text-align: left; font-size: 1.2rem; }
.cenario-consequencia { margin: 14px 0 6px; font-size: 1.15rem; background: var(--verde-claro); border-radius: 12px; padding: 10px 16px; border-left: 6px solid var(--verde); }
.cenario-fim { margin-top: 12px; background: var(--amarelo-claro); border-radius: 14px; padding: 12px 18px; border-left: 8px solid var(--amarelo); }
.cenario-fim p { font-size: 1.25rem; margin: 2px 0 0; }

/* ---------- conjugar ---------- */

.conjugar-verbo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 1.3rem; margin-bottom: 12px; }
.conjugar-verbo strong { color: var(--azul-escuro); background: var(--amarelo-claro); border-radius: 8px; padding: 2px 12px; margin-right: 12px; }
.conjugar-rotulo { font-size: 0.85rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.04em; }
.conjugar-tabela { border-collapse: separate; border-spacing: 0 8px; margin-bottom: 8px; min-width: 460px; }
.conjugar-tabela th { text-align: right; padding: 6px 18px 6px 12px; font-size: 1.3rem; color: var(--azul-escuro); background: var(--azul-palido); border-radius: 12px 0 0 12px; min-width: 120px; }
.conjugar-tabela td { background: var(--branco); border-radius: 0 12px 12px 0; padding: 6px 12px; }
.conjugar-dada { display: inline-block; font-size: 1.3rem; color: var(--texto-suave); padding: 8px 6px; }
.conjugar-campo { width: 12ch; font-size: 1.3rem; }
.conjugar-escolha {
  min-width: 12ch; min-height: 52px; font-size: 1.3rem; text-align: left;
  background: var(--azul-muito-palido); border: 2px solid var(--azul-claro); border-bottom: 4px solid var(--azul); border-radius: 10px;
}
.conjugar-escolha.vazia::after { content: "▾"; color: var(--azul); float: right; }
.conjugar-escolha.tentar, .conjugar-escolha.tentar.vazia { background: var(--amarelo-claro); border-color: var(--amarelo); }
.conjugar-escolha.certo, .conjugar-escolha.mostrado { background: var(--verde-claro); border-color: var(--verde); color: var(--texto); }
.conjugar-escolha.mostrado { border-style: dashed; }
.conjugar-escolha.escolhido { background: var(--azul-palido); }
.conjugar-frase {
  font-size: 1.45rem; line-height: 2.2; max-width: 980px; background: var(--branco); border-radius: 14px; padding: 14px 22px; margin-bottom: 10px;
  box-shadow: 0 1px 3px rgba(22, 64, 122, 0.08);
}
.conjugar-frase .conjugar-campo { margin: 0 4px; }
.conjugar-infinitivo { color: var(--texto-suave); font-size: 1.1rem; margin: 0 6px 0 2px; }
.conjugar-lugar { display: inline-block; min-width: 7em; border-bottom: 4px solid var(--azul); text-align: center; font-weight: 700; margin: 0 4px; line-height: 1.4; }
.conjugar-lugar.certo, .conjugar-lugar.mostrado { color: var(--verde); border-color: var(--verde); }
.conjugar-lugar.mostrado { border-bottom-style: dashed; }
.conjugar-identificar { font-size: 2.2rem; font-weight: 800; color: var(--azul-escuro); margin-bottom: 4px; }
.conjugar-contexto { font-size: 1.2rem; color: var(--texto-suave); margin-bottom: 14px; }
.escolhas-formas { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); max-width: 900px; }
@media (max-width: 600px) { .conjugar-tabela { min-width: 0; width: 100%; } .conjugar-tabela th { min-width: 0; } }

/* ---------- palavras ---------- */

.fabrica-pedido { max-width: 900px; background: var(--branco); border-radius: 16px; padding: 12px 22px; margin-bottom: 16px; border-left: 8px solid var(--amarelo); box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); }
.fabrica-rotulo { font-size: 0.85rem; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.04em; }
.fabrica-sentido { font-size: 1.5rem; font-weight: 700; color: var(--azul-escuro); margin: 2px 0 0; }
.fabrica-maquina {
  display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 96px; max-width: 900px; margin-bottom: 8px;
  background: var(--azul-escuro); border-radius: 18px; padding: 14px;
}
.fabrica-encaixe {
  min-width: 140px; min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 6px 18px;
  font-size: 1.5rem; font-weight: 700; border-radius: 12px; border: 3px dashed var(--azul-claro); color: var(--azul-claro);
}
.fabrica-encaixe.cheio { border-style: solid; border-color: var(--papel); background: var(--papel); color: var(--azul-escuro); }
.fabrica-mais { color: var(--amarelo); font-size: 2rem; font-weight: 800; }
.fabrica-resultado { font-size: 2.2rem; font-weight: 800; color: var(--azul-escuro); background: var(--papel); border-radius: 12px; padding: 6px 28px; animation: pousar 320ms ease-out; }
.fabrica-maquina.certo .fabrica-resultado { background: var(--verde-claro); color: var(--verde); }
.fabrica-maquina.mostrado .fabrica-resultado { background: var(--verde-claro); color: var(--verde); border: 3px dashed var(--verde); }
.fabrica-pecas { display: flex; flex-wrap: wrap; gap: 10px; max-width: 900px; }
.fabrica-peca { font-size: 1.35rem; min-height: 56px; min-width: 90px; padding: 6px 18px; border-radius: 12px; border: 2px solid var(--azul-claro); background: var(--branco); color: var(--texto); box-shadow: 0 2px 0 var(--azul-palido); }
.fabrica-peca.afixo { background: var(--amarelo-claro); border-color: var(--amarelo); font-weight: 700; }
.fabrica-peca.escolhido { outline: 4px solid var(--azul); outline-offset: 2px; }
.familia-palavras { display: flex; flex-wrap: wrap; gap: 12px; max-width: 900px; margin-bottom: 8px; }
.familia-palavra { position: relative; font-size: 1.4rem; min-height: 60px; min-width: 120px; padding: 8px 20px; border-radius: 14px; border: 3px solid var(--azul-claro); background: var(--branco); color: var(--texto); }
.familia-palavra.escolhido { border-color: var(--azul); background: var(--azul-palido); }
.familia-palavra.certo, .familia-palavra.mostrado { border-color: var(--verde); background: var(--verde-claro); }
.familia-palavra.mostrado { border-style: dashed; }
.familia-palavra.errado-marca { text-decoration: line-through; text-decoration-color: var(--laranja); color: var(--texto-suave); }

/* ===================================================================

/* ===================================================================
 * Matemática (etapa 3) — peças comuns
 * =================================================================== */

.mat-figura { margin: 0 0 22px; max-width: 1000px; }
.mat-svg { display: block; overflow: visible; }
.mat-svg-texto { font-family: var(--letra); fill: var(--texto); font-size: 20px; }
.mat-expressao { font-size: 2.2rem; font-weight: 800; color: var(--azul-escuro); margin: 0 0 20px; letter-spacing: 0.02em; }
.mat-resposta { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.mat-linha { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; font-size: 2rem; font-weight: 700; color: var(--azul-escuro); line-height: 1.3; }
.mat-linha .campo-numero { font-size: 2rem; width: 6ch; min-height: 64px; font-weight: 700; }
.mat-resposta.varias .mat-linha { font-size: 1.7rem; }
.mat-resposta.varias .campo-numero { font-size: 1.7rem; min-height: 56px; }
.mat-opcoes .opcao { font-size: 1.6rem; font-weight: 700; }
.mat-opcoes.curtas { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 820px; }
.mat-opcoes.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 760px; }
.campo.escolhido { border-color: var(--azul-escuro); background: var(--azul-palido); }

/* ---------- reta ---------- */

.reta-linha { stroke: var(--azul-escuro); stroke-width: 4; stroke-linecap: round; }
.reta-ponta { fill: var(--azul-escuro); }
.reta-traco { stroke: var(--azul-escuro); stroke-width: 2.5; }
.reta-traco.grande { stroke-width: 4; }
.reta-rotulo { font-size: 28px; font-weight: 700; fill: var(--azul-escuro); }
.reta-interrogacao { fill: var(--laranja); }
.reta-seta { fill: var(--amarelo); stroke: var(--amarelo-texto); stroke-width: 2; stroke-linejoin: round; }
.reta-seta-haste { stroke: var(--amarelo-texto); stroke-width: 4; stroke-linecap: round; }
.reta-rotulo-seta { font-size: 30px; font-weight: 800; fill: var(--amarelo-texto); }
.reta-zona { fill: transparent; cursor: pointer; outline: none; }
.reta-zona:hover, .reta-zona:focus-visible { fill: rgba(224, 170, 46, 0.18); }
.reta-marca circle { fill: var(--amarelo); stroke: var(--azul-escuro); stroke-width: 3; }
.reta-marca.certa circle { fill: var(--verde); stroke: var(--verde); }
.reta-marca.tentada circle { fill: var(--cinzento-claro); stroke: var(--cinzento); stroke-dasharray: 4 3; }
.reta-marca.escolhida circle { fill: var(--azul); }
.reta-marca.mostrada circle { fill: var(--verde-claro); stroke: var(--verde); stroke-width: 4; stroke-dasharray: 5 3; }
.reta-colocar .mat-svg, .reta-com-extremos .mat-svg { width: 900px; }
.escolhas.reta-extremos { display: flex; justify-content: space-between; max-width: 915px; }
.escolhas.reta-extremos .opcao { min-width: 150px; }

/* ---------- abaco ---------- */

.abaco-colunas { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.abaco-coluna { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--branco); border: 3px solid var(--azul-palido); border-radius: 16px; padding: 10px 10px 12px; min-width: 150px; }
.abaco-coluna.certo { border-color: var(--verde); background: #f1f9f3; }
.abaco-coluna.tentar { border-color: var(--amarelo); background: #fff8e6; }
.abaco-coluna.mostrado { border-color: var(--verde); border-style: dashed; }
.abaco-cabeca { font-weight: 800; color: var(--azul-escuro); font-size: 1.15rem; text-transform: capitalize; }
.material-quadro .abaco-cabeca, .material-abaco .abaco-cabeca { font-size: 1.6rem; text-transform: none; }
.abaco-zona { display: flex; align-items: flex-end; justify-content: center; min-height: 120px; }
.abaco-zona .mat-svg { width: 180px; }
.abaco-zona .abaco-svg { width: 110px; }
.quadro-digito { font-size: 3rem; font-weight: 800; color: var(--azul-escuro); min-width: 1.4em; text-align: center; }
.abaco-controlos { display: flex; align-items: center; gap: 10px; }
.abaco-botao { min-width: 52px; min-height: 52px; padding: 0; font-size: 1.6rem; font-weight: 800; }
.abaco-contagem { min-width: 1.6em; text-align: center; font-size: 1.6rem; font-weight: 800; color: var(--azul-escuro); }
.mab-cubinho { fill: #f3d58a; stroke: var(--amarelo-texto); stroke-width: 2; }
.mab-barra { fill: #f3d58a; stroke: var(--amarelo-texto); stroke-width: 2; }
.mab-placa { fill: #f3d58a; stroke: var(--amarelo-texto); stroke-width: 2; }
.mab-risca { stroke: var(--amarelo-texto); stroke-width: 1.2; opacity: 0.7; }
.mab-risca.fina { stroke-width: 0.8; opacity: 0.45; }
.mab-cubo { stroke: var(--amarelo-texto); stroke-width: 2; stroke-linejoin: round; }
.mab-cubo.frente { fill: #f3d58a; }
.mab-cubo.topo { fill: #f9e6b3; }
.mab-cubo.lado { fill: #e0bd62; }
.abaco-haste { stroke: var(--cinzento); stroke-width: 5; stroke-linecap: round; }
.abaco-base { fill: var(--azul-escuro); }
.abaco-conta { fill: var(--azul); stroke: var(--azul-escuro); stroke-width: 2; }

/* ---------- algoritmo ---------- */

.alg-grelha { display: grid; gap: 6px 8px; align-items: center; justify-items: center; background: var(--branco); padding: 14px 22px 18px; border-radius: 18px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); width: max-content; }
.alg-celula { display: flex; align-items: center; justify-content: center; min-width: 48px; }
.alg-ordem { font-weight: 800; color: var(--texto-suave); font-size: 1.2rem; }
.alg-dado { font-size: 2.4rem; font-weight: 700; color: var(--azul-escuro); height: 64px; }
.alg-sinal { font-size: 2.2rem; font-weight: 800; color: var(--azul-escuro); }
.alg-traco { height: 0; border-top: 4px solid var(--azul-escuro); width: 100%; justify-self: stretch; }
.alg-casa { font: inherit; width: 58px; height: 64px; text-align: center; font-size: 2.2rem; font-weight: 700; border: 3px solid var(--azul-claro); border-radius: 12px; background: var(--azul-muito-palido); color: var(--texto); padding: 0; }
.alg-casa:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 4px var(--amarelo-claro); background: var(--branco); }
.alg-casa:disabled { background: var(--papel); }
.alg-casa.alg-vai { width: 36px; height: 36px; font-size: 1.2rem; border-width: 2px; border-style: dashed; background: transparent; }
.alg-celula-vai { height: 40px; }
.alg-casa.certo { border-color: var(--verde); background: var(--verde-claro); }
.alg-casa.tentar { border-color: var(--amarelo); background: var(--amarelo-claro); }
.alg-casa.mostrado { border-color: var(--verde); border-style: dashed; background: var(--verde-claro); }
.alg-casa.escolhido { border-color: var(--azul-escuro); background: var(--azul-palido); }
.alg-em-linha { font-size: 1.8rem; color: var(--azul-escuro); white-space: nowrap; }
.detetive-alg { margin-top: 4px; }
.alg-vai-robo { height: 34px; font-size: 1.15rem; font-weight: 700; color: var(--laranja); }
.detetive-algarismo { font-size: 2.2rem; font-weight: 700; min-width: 58px; min-height: 64px; padding: 0 6px; }
.detetive-algarismo .detetive-antes { font-size: 0.9rem; }
.modo-algoritmo .campo-detetive, .detetive-correcao .campo-detetive { max-width: 520px; }

/* ---------- fracao ---------- */

.fracao-figura .mat-svg { max-width: 100%; }
.fracao-parte { fill: var(--branco); stroke: var(--azul-escuro); stroke-width: 3; stroke-linejoin: round; transition: fill 120ms; }
.fracao-parte.pintada { fill: var(--azul); }
.fracao-parte.clicavel { cursor: pointer; outline: none; }
.fracao-parte.clicavel:hover:not(.pintada), .fracao-parte.clicavel:focus-visible:not(.pintada) { fill: var(--amarelo-claro); }
.fracao-parte.clicavel:focus-visible { stroke: var(--amarelo); stroke-width: 5; }
.fracao-svg.certo .fracao-parte.pintada { fill: var(--verde); }
.fracao-svg.mostrado .fracao-parte { stroke-dasharray: 6 4; }
.fracao-contagem { font-weight: 700; color: var(--azul-escuro); margin: 0; }
.fracao-em-pe { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-weight: 800; }
.fracao-em-pe .fracao-num { border-bottom: 3px solid currentColor; padding: 0 0.15em; }
.fracao-em-pe.pequena { font-size: 1.3rem; color: var(--azul-escuro); }
.fracao-em-pe.grande { font-size: 2.6rem; color: var(--azul-escuro); }
.mat-opcoes .opcao .fracao-em-pe { font-size: 1.7rem; }
.mat-resposta.mat-fracao { gap: 0; }
.mat-resposta.mat-fracao .mat-linha:first-child { border-bottom: 5px solid var(--azul-escuro); padding-bottom: 8px; margin-bottom: 8px; }
.mat-resposta.mat-fracao .campo-numero { width: 3.4ch; }
.fracao-partilha { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.fracao-partilha .mat-svg { width: 170px; }
.fracao-partilha .forma-barra { width: 360px; }
.fracao-legenda { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 0.95rem; color: var(--texto-suave); }
.fracao-crianca { display: inline-flex; align-items: center; gap: 6px; }
.fracao-bola { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.fracao-comparar { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.fracao-lado { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fracao-lado .mat-svg { width: 300px; }
.fracao-caixa-sinal { font-size: 2.4rem; font-weight: 800; color: var(--laranja); border: 3px dashed var(--laranja); border-radius: 14px; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
.fracao-clicar { display: inline-flex !important; flex-direction: column; align-items: center; gap: 10px; }
.fracao-clicar .opcao { min-width: 110px; font-size: 2.6rem; font-weight: 800; }
.fracao-traco { width: 140px; border-top: 5px solid var(--azul-escuro); }
.fracao-caixa-sinal.certo, .fracao-caixa-sinal.mostrado { color: var(--verde); border-color: var(--verde); background: var(--verde-claro); }
.fracao-caixa-sinal.certo { border-style: solid; }

/* ---------- balanca ---------- */

.balanca .mat-svg { width: 720px; }
.balanca-barra { stroke: var(--azul-escuro); stroke-width: 10; stroke-linecap: round; }
.balanca-fio { stroke: var(--cinzento); stroke-width: 3; }
.balanca-prato { fill: var(--branco); stroke: var(--azul); stroke-width: 4; }
.balanca-expr { font-size: 32px; font-weight: 800; fill: var(--azul-escuro); }
.balanca-pe { fill: var(--azul-claro); }
.balanca-base, .balanca-eixo { fill: var(--azul-escuro); }
.balanca-barra, .balanca-lado { transition: transform 400ms ease-out; }
@media (prefers-reduced-motion: reduce) { .balanca-barra, .balanca-lado { transition: none; } }
.mat-figura.balanca, .mat-figura svg.balanca { max-width: 720px; }
.escolhas.varias .opcao { font-size: 1.4rem; }

/* ---------- sequencia ---------- */

.seq-linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seq-token { display: inline-flex; align-items: center; justify-content: center; min-width: 60px; height: 64px; }
.seq-token .mat-svg { width: 52px; height: 52px; }
.seq-texto { font-size: 2rem; font-weight: 800; color: var(--azul-escuro); background: var(--branco); border-radius: 12px; padding: 0 12px; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); }
.seq-falta { color: var(--laranja); border: 3px dashed var(--laranja); background: var(--laranja-claro); }
.seq-reticencias { background: transparent; box-shadow: none; color: var(--texto-suave); }
.seq-cor { width: 46px; height: 46px; border-radius: 50%; display: inline-block; border: 3px solid rgba(0, 0, 0, 0.25); }
.seq-forma { fill: var(--azul); stroke: var(--azul-escuro); stroke-width: 2.5; stroke-linejoin: round; }
.seq-forma.forma-circulo { fill: var(--amarelo); }
.seq-forma.forma-quadrado { fill: #23703f; }
.seq-forma.forma-estrela { fill: #e0aa2e; }
.seq-forma.forma-losango { fill: #a3471f; }
.seq-forma.forma-coracao { fill: #d4688c; }
.seq-botao { padding: 4px; min-height: 72px; border-radius: 14px; border: 3px solid transparent; background: transparent; }
.seq-botao:hover:not(:disabled) { border-color: var(--amarelo); background: var(--amarelo-claro); }
.seq-botao.tentado { opacity: 0.45; border-style: dashed; border-color: var(--cinzento); }
.seq-botao.grupo-certo { border-color: var(--verde); background: var(--verde-claro); }
.seq-botao.grupo-mostrado { border-color: var(--verde); border-style: dashed; background: var(--verde-claro); }
.seq-botao.escolhido { border-color: var(--azul-escuro); background: var(--azul-palido); }
.seq-opcoes { grid-template-columns: repeat(auto-fill, minmax(120px, 160px)) !important; }
.seq-opcoes .opcao { display: flex; align-items: center; justify-content: center; }

/* ---------- grafico ---------- */

.graf-svg { max-width: 760px; }
.graf-titulo { font-size: 22px; font-weight: 800; fill: var(--azul-escuro); }
.graf-eixo { stroke: var(--azul-escuro); stroke-width: 3; }
.graf-guia { stroke: var(--azul-palido); stroke-width: 1.5; }
.graf-numero { font-size: 16px; fill: var(--texto-suave); text-anchor: end; }
.graf-eixo-rotulo { font-size: 15px; fill: var(--texto-suave); }
.graf-categoria { font-size: 18px; font-weight: 700; fill: var(--azul-escuro); }
.graf-barra { fill: var(--azul); stroke: var(--azul-escuro); stroke-width: 2; transition: y 150ms, height 150ms; }
.graf-barra.certa { fill: var(--verde); stroke: var(--verde); }
.graf-barra.tentar { fill: var(--amarelo); stroke: var(--amarelo-texto); }
.graf-barra.mostrada { fill: var(--verde-claro); stroke: var(--verde); stroke-dasharray: 5 3; }
.graf-zona { fill: transparent; cursor: pointer; outline: none; }
.graf-zona:hover, .graf-zona:focus-visible { fill: rgba(224, 170, 46, 0.25); }
.graf-construir { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.graf-tabela-dados { border-collapse: collapse; background: var(--branco); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(22, 64, 122, 0.10); }
.graf-tabela-dados caption { font-weight: 800; color: var(--azul-escuro); text-align: left; padding: 4px 0 8px; }
.graf-tabela-dados th, .graf-tabela-dados td { border: 2px solid var(--azul-palido); padding: 6px 14px; font-size: 1.2rem; text-align: left; }
.graf-tabela-dados.pequena td { font-weight: 800; text-align: center; }
.graf-traco { stroke: var(--azul-escuro); stroke-width: 3.5; stroke-linecap: round; }
.graf-lista-titulo { font-weight: 800; color: var(--azul-escuro); margin-bottom: 8px; }
.graf-lista-palavras { display: flex; flex-wrap: wrap; gap: 8px; max-width: 900px; }
.graf-resposta { background: var(--branco); border: 2px solid var(--azul-palido); border-radius: 10px; padding: 4px 12px; font-size: 1.1rem; }
.mat-resposta.graf-tabela { display: inline-grid; grid-template-columns: max-content max-content; gap: 8px 24px; align-items: center; }
.mat-resposta.graf-tabela .mat-linha { display: contents; font-size: 1.4rem; }
.graf-pictograma { border-collapse: collapse; }
.graf-pictograma caption { font-weight: 800; color: var(--azul-escuro); text-align: left; padding-bottom: 8px; }
.graf-pictograma th { text-align: left; padding: 6px 16px 6px 0; font-size: 1.2rem; }
.graf-pictograma td { padding: 6px 0; }
.graf-simbolo { display: inline-block; width: 34px; height: 34px; margin-right: 6px; vertical-align: middle; background: var(--amarelo); border: 3px solid var(--amarelo-texto); border-radius: 50%; }
.graf-simbolo.parte { border-radius: 34px 0 0 34px; border-right: 0; }
.graf-legenda { margin-top: 10px; font-weight: 700; color: var(--azul-escuro); }
.graf-caule { border-collapse: collapse; background: var(--branco); }
.graf-caule th, .graf-caule td { padding: 6px 16px; font-size: 1.4rem; }
.graf-caule th { color: var(--texto-suave); font-size: 1rem; }
.graf-caule td:first-child { border-right: 4px solid var(--azul-escuro); text-align: right; font-weight: 800; color: var(--azul-escuro); }
.graf-folhas { width: 14ch; font-size: 1.4rem; letter-spacing: 0.1em; }

/* ---------- grelha ---------- */

.grelha-caixa { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.grelha { display: grid; gap: 3px; background: transparent; }
.grelha-rotulo { display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--azul-escuro); font-size: 1.2rem; min-height: 40px; }
.grelha-casa { width: 72px; height: 64px; min-height: 0; padding: 2px; border-radius: 6px; border: 2px solid var(--azul-claro); background: var(--branco); display: flex; align-items: center; justify-content: center; }
button.grelha-casa:hover:not(:disabled) { background: var(--amarelo-claro); border-color: var(--amarelo); }
.grelha-casa .mat-svg { width: 44px; height: 44px; }
.grelha-lugar { font-size: 0.62rem; font-weight: 700; line-height: 1.1; color: var(--azul-escuro); text-align: center; hyphens: auto; overflow-wrap: break-word; }
.grelha-casa.certa { background: var(--verde-claro); border-color: var(--verde); }
.grelha-casa.tentada { background: var(--cinzento-claro); border-style: dashed; border-color: var(--cinzento); }
.grelha-casa.mostrada { background: var(--verde-claro); border-color: var(--verde); border-style: dashed; }
.grelha-casa.escolhida { background: var(--azul-palido); border-color: var(--azul-escuro); }
.grelha-casa.partida { background: var(--amarelo-claro); border-color: var(--amarelo); border-width: 3px; }
.grelha-casa.agua { background: var(--azul-palido); }
.grelha-casa.barco { background: var(--amarelo); }
.grelha-resultado { font-size: 0.8rem; font-weight: 800; color: var(--azul-escuro); }
.grelha-placar { font-weight: 700; color: var(--azul-escuro); }
.grelha-tiro { font-weight: 700; }
.grelha-rosa { width: 110px; }
.rosa-ns { fill: var(--azul-escuro); }
.rosa-eo { fill: var(--azul-claro); }
.rosa-letra { font-size: 15px; font-weight: 800; fill: var(--azul-escuro); }

/* ---------- problema ---------- */

.prob-etapas { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 16px; }
.prob-etapa { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; border-radius: 999px; background: var(--cinzento-claro); color: var(--texto-suave); font-weight: 700; font-size: 0.95rem; }
.prob-num { width: 28px; height: 28px; border-radius: 50%; background: var(--branco); display: inline-flex; align-items: center; justify-content: center; }
.prob-etapa.atual { background: var(--azul); color: var(--branco); }
.prob-etapa.atual .prob-num { color: var(--azul-escuro); }
.prob-etapa.feita { background: var(--verde-claro); color: var(--verde); }
.prob-enunciado { max-width: 900px; font-size: 1.45rem; line-height: 2; background: var(--branco); border-radius: 16px; padding: 14px 22px; margin-bottom: 16px; border-left: 8px solid var(--azul-claro); }
.prob-segmento { font: inherit; font-size: inherit; line-height: 1.4; padding: 0 4px; min-height: 0; border-radius: 8px; border: 2px dashed transparent; background: transparent; color: inherit; }
.prob-enunciado.a-escolher .prob-segmento { border-color: var(--azul-claro); }
.prob-segmento.escolhido { background: var(--amarelo-claro); border: 2px solid var(--amarelo); }
.prob-segmento.certo { background: var(--verde-claro); border: 2px solid var(--verde); }
.prob-segmento.mostrado { background: var(--verde-claro); border: 2px dashed var(--verde); }
.prob-zona { display: flex; flex-direction: column; gap: 12px; max-width: 900px; }
.prob-ops { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.prob-op { min-width: 90px; font-size: 2rem; font-weight: 800; }
.prob-rotulo { font-weight: 700; color: var(--texto-suave); min-width: 80px; }
.prob-frase { min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--branco); border-radius: 14px; padding: 8px 14px; border: 3px dashed var(--azul-claro); margin: 0; }
.prob-vazia { color: var(--texto-suave); font-size: 1rem; }
.prob-banco { display: flex; flex-wrap: wrap; gap: 10px; }
.prob-peca { font-size: 1.3rem; min-height: 54px; border-color: var(--azul-claro); }
.prob-peca:disabled { opacity: 0.3; }
.prob-peca.na-frase { background: var(--azul-palido); }

/* ---------- opções com figuras (matematica.js) ---------- */

.escolhas.mat-opcoes-figuras { display: flex; flex-wrap: wrap; gap: 16px; max-width: none; }
.mat-opcoes-figuras .opcao { flex-direction: column; gap: 6px; padding: 10px 12px; min-width: 150px; }
.mat-opcao-letra { font-size: 1.1rem; font-weight: 800; color: var(--texto-suave); }

/* ---------- relogio ---------- */

.relogio { width: 220px; }
.relogio.grande { width: 280px; }
.relogio.pequeno { width: 150px; }

    this.c = conteudo;
    this.armazem = armazem || M.armazemMemoria();
    this.assinatura = String((opcoes && opcoes.assinatura) || U.hash(JSON.stringify(conteudo)));
    this.lista = [];
    this.porId = {};
    var self = this;
    conteudo.dominios.forEach(function (d, di) {
      d.atividades.forEach(function (a) {
        var info = { dados: a, dominio: di, ordem: self.lista.length };
        self.lista.push(info);
        self.porId[a.id] = info;
      });
    });
    this.cache = {};
    this.progresso = {};
    this.cacheDesafio = null;
    this.progressoDesafio = null;
    var lido = null;
    try { lido = this.armazem.ler(); } catch (e) { lido = null; }
    if (this.estadoAceitavel(lido)) {
      this.estado = lido;
      this.sanear();
    } else {
      var anterior = (eObjeto(lido) && eNatural(lido.sessao)) ? lido.sessao : 0;
      this.estado = this.estadoNovo(anterior + 1, {});
      this.gravar();
    }
  }

  Sessao.prototype.estadoAceitavel = function (e) {
    return eObjeto(e) && e.versao === VERSAO_ESTADO && e.assinatura === this.assinatura &&
      eNatural(e.sessao) && e.sessao >= 1 && eObjeto(e.historico) && eObjeto(e.atividades) && eObjeto(e.azulejos) &&
      (e.desafio === null || e.desafio === undefined || eObjeto(e.desafio));
  };

  /* Retira do estado lido o que não se pode usar (estado estragado ou alterado à mão). */
  Sessao.prototype.sanear = function () {
    var self = this;
    var e = this.estado;
    Object.keys(e.atividades).forEach(function (id) {
      if (!self.porId[id] || !atividadeValida(e.atividades[id])) delete e.atividades[id];
    });
    Object.keys(e.azulejos).forEach(function (id) {
      if (id !== "__desafio" && !self.porId[id]) delete e.azulejos[id];
    });
    Object.keys(e.historico).forEach(function (id) {
      if (!self.porId[id] || !Array.isArray(e.historico[id])) delete e.historico[id];
    });
    if (!e.desafio || !desafioValido(e.desafio, this.porId)) e.desafio = null;
  };

  Sessao.prototype.estadoNovo = function (numero, historico) {
    return {
      versao: VERSAO_ESTADO,
      assinatura: this.assinatura,
      sessao: numero,
      historico: historico || {},
      atividades: {},
      azulejos: {},
      desafio: null
    };
  };

  Sessao.prototype.gravar = function () {
    try { this.armazem.gravar(this.estado); } catch (e) { /* nada */ }
  };

  Sessao.prototype.dados = function (id) { return this.porId[id].dados; };

  Sessao.prototype.semente = function (id, tentativa, extra) {
    var partes = [this.c.id, this.estado.sessao, id];
    if (tentativa && tentativa > 1) partes.push("t" + tentativa);
    if (extra) partes.push(extra);
    return U.semente.apply(null, partes);
  };

  /* ---------- Atividades ---------- */

  Sessao.prototype.estadoAtividade = function (id) { return this.estado.atividades[id] || null; };

  Sessao.prototype.iniciar = function (id) {
    var ea = this.estado.atividades[id];
    if (!ea) {
      ea = this.estado.atividades[id] = { tentativa: 1, estado: "curso", ronda: 0, pos: 0, falhas: [], partesFalhadas: [], detalheFalhas: [], resultados: {} };
      this.gravar();
    }
    return ea;
  };

  /* Recomeça uma atividade já feita (nova tentativa, novos itens; o azulejo fica). */
  Sessao.prototype.fazerOutraVez = function (id) {
    var anterior = this.estado.atividades[id];
    var t = anterior ? anterior.tentativa + 1 : 1;
    this.estado.atividades[id] = { tentativa: t, estado: "curso", ronda: 0, pos: 0, falhas: [], partesFalhadas: [], detalheFalhas: [], resultados: {} };
    delete this.cache[id];
    this.gravar();
  };

  Sessao.prototype.itensRonda = function (id, ronda) {
    var ea = this.estado.atividades[id];
    var cache = this.cache[id];
    if (!cache || cache.tentativa !== ea.tentativa) cache = this.cache[id] = { tentativa: ea.tentativa, rondas: [] };
    if (cache.rondas[ronda]) return cache.rondas[ronda];
    var dados = this.dados(id);
    var itens;
    if (ronda === 0) {
      itens = M.prepararAtividade(dados, U.rng(this.semente(id, ea.tentativa)), { vistos: this.estado.historico[id] || [] });
    } else {
      var anteriores = this.itensRonda(id, ronda - 1);
      var falhas = ea.falhas[ronda - 1] || [];
      var detalhe = (ea.detalheFalhas && ea.detalheFalhas[ronda - 1]) || {};
      var falhados = anteriores.filter(function (it) { return falhas.indexOf(it.chave) >= 0; }).map(function (it) {
        var copia = U.copiar(it);
        copia.partesFalhadas = detalhe[it.chave] || it.partes.slice();
        return copia;
      });
      itens = M.repetirAtividade(dados, falhados, U.rng(this.semente(id, ea.tentativa, "r" + ronda)), ronda);
    }
    cache.rondas[ronda] = itens;
    return itens;
  };

  /*
   * Item atual da atividade, ou null se a ronda acabou.
   * reabrir: o item vai ser desenhado de novo (a criança saiu a meio e voltou). O que estava
   * a meio recomeça, mas os erros já dados contam: a resposta deixa de ser «à primeira».
   */
  Sessao.prototype.itemAtual = function (id, reabrir) {
    var ea = this.iniciar(id);
    var itens = this.itensRonda(id, ea.ronda);
    if (ea.pos >= itens.length) return null;
    var item = itens[ea.pos];
    if (reabrir || !this.progresso[id] || this.progresso[id].chave !== item.chave) {
      var erros = (eObjeto(ea.erros) && ea.erros.chave === item.chave && eObjeto(ea.erros.partes)) ? ea.erros.partes : null;
      this.progresso[id] = novoProgresso(item, erros);
      this.progresso[id].chave = item.chave;
    }
    return item;
  };

  Sessao.prototype.rondaTerminada = function (id) {
    var ea = this.estado.atividades[id];
    return !!ea && ea.pos >= this.itensRonda(id, ea.ronda).length;
  };

  /*
   * Aplica uma resposta ao item atual. Quando o item fica terminado (r.fim), o resultado é
   * registado e gravado logo: fechar a ficha antes de clicar em «Continuar» não perde nada.
   * Um erro num item ainda por terminar também é gravado.
   */
  Sessao.prototype.responder = function (id, resposta) {
    var item = this.itemAtual(id);
    if (!item) throw new Error("Nenhum item em curso na atividade " + id);
    var ea = this.estado.atividades[id];
    var prog = this.progresso[id];
    var tipo = M.tipo(this.dados(id).tipo);
    var r = M.aplicarCorrecao(tipo, item, prog, resposta, 0);
    r.item = item;
    if (r.fim) {
      this.registar(id, item, prog);
    } else if (r.erroAgora) {
      ea.erros = errosDoProgresso(item, prog);
      this.gravar();
    }
    return r;
  };

  /* Regista o resultado de um item terminado e passa ao seguinte. */
  Sessao.prototype.registar = function (id, item, prog) {
    var ea = this.estado.atividades[id];
    var itens = this.itensRonda(id, ea.ronda);
    var resumo = resumirProgresso(item, prog);
    if (ea.ronda === 0) ea.resultados[item.chave] = resumo;
    ea.falhas[ea.ronda] = ea.falhas[ea.ronda] || [];
    ea.partesFalhadas = ea.partesFalhadas || [];
    var falhadas = Object.keys(resumo.partes).filter(function (k) { return !resumo.partes[k].c; });
    if (falhadas.length) {
      ea.falhas[ea.ronda].push(item.chave);
      ea.partesFalhadas[ea.ronda] = (ea.partesFalhadas[ea.ronda] || 0) + falhadas.length;
      ea.detalheFalhas = ea.detalheFalhas || [];
      ea.detalheFalhas[ea.ronda] = ea.detalheFalhas[ea.ronda] || {};
      ea.detalheFalhas[ea.ronda][item.chave] = falhadas;
    }
    this.passar(id, itens);
  };

  Sessao.prototype.passar = function (id, itens) {
    var ea = this.estado.atividades[id];
    ea.pos++;
    delete ea.erros;
    delete this.progresso[id];
    if (ea.pos >= itens.length) this.terminarRonda(id);
    this.gravar();
  };

  /* Salta o item atual sem o contar (item que não se consegue desenhar). Devolve true se a ronda acabou. */
  Sessao.prototype.saltar = function (id) {
    var ea = this.iniciar(id);
    var itens = this.itensRonda(id, ea.ronda);
    if (ea.pos < itens.length) this.passar(id, itens);
    return this.rondaTerminada(id);
  };

  /* Depois de um item terminado: a ronda acabou? (O registo é feito em responder.) */
  Sessao.prototype.avancar = function (id) {
    return this.rondaTerminada(id);
  };

  Sessao.prototype.terminarRonda = function (id) {
    var ea = this.estado.atividades[id];
    ea.estado = "concluida";
    ea.falhas[ea.ronda] = ea.falhas[ea.ronda] || [];
    if (!ea.falhas[ea.ronda].length) {
      var r = this.resultadoPrimeira(id);
      var novo = (r.total > 0 && r.certos === r.total) ? "dourado" : "normal";
      var antigo = this.estado.azulejos[id];
      if (antigo !== "dourado") this.estado.azulejos[id] = novo;
      ea.azulejoAgora = novo;
    }
  };

  /* Há itens por rever (falhados na última ronda)? */
  Sessao.prototype.pendentes = function (id) {
    var ea = this.estado.atividades[id];
    if (!ea || ea.estado !== "concluida") return 0;
    var falhas = ea.falhas[ea.ronda] || [];
    if (!falhas.length) return 0;
    return (ea.partesFalhadas && ea.partesFalhadas[ea.ronda]) || falhas.length;
  };

  Sessao.prototype.segundaOportunidade = function (id) {
    var ea = this.estado.atividades[id];
    if (!this.pendentes(id)) return false;
    ea.ronda++;
    ea.pos = 0;
    delete ea.azulejoAgora;
    this.gravar();
    return true;
  };

  /* Resultado «à primeira» da ronda 0 (partes certas à primeira / total de partes). */
  Sessao.prototype.resultadoPrimeira = function (id) {
    var ea = this.estado.atividades[id];
    var certos = 0;
    var total = 0;
    if (!ea) return { certos: 0, total: 0 };
    Object.keys(ea.resultados).forEach(function (ch) {
      var r = ea.resultados[ch];
      Object.keys(r.partes).forEach(function (k) { total++; certos += r.partes[k].p; });
    });
    return { certos: certos, total: total };
  };

  /*
   * Palavras (ou formas) para rever: partes falhadas à primeira na ronda 0, para os tipos
   * que definem rever(item, ids) (ditado, conjugar…). Sem repetições, pela ordem dos itens.
   */
  Sessao.prototype.paraRever = function (id) {
    var tipo = M.tipos[this.dados(id).tipo];
    var ea = this.estado.atividades[id];
    if (!tipo || !tipo.rever || !ea) return [];
    var vistos = {};
    var saida = [];
    this.itensRonda(id, 0).forEach(function (it) {
      var res = ea.resultados[it.chave];
      if (!res) return;
      var falhadas = it.partes.filter(function (k) { return res.partes[k] && !res.partes[k].p; });
      if (!falhadas.length) return;
      (tipo.rever(it, falhadas) || []).forEach(function (x) {
        var k = U.normalizar(x, { exato: true });
        if (x && !vistos[k]) { vistos[k] = true; saida.push(x); }
      });
    });
    return saida;
  };

  /* Estado do cartão no ecrã inicial. */
  Sessao.prototype.estadoCartao = function (id) {
    var az = this.estado.azulejos[id];
    var ea = this.estado.atividades[id];
    if (az === "dourado") return "dourado";
    if (az) return "azulejo";
    if (!ea) return "nova";
    if (ea.estado === "concluida") return "feita";
    return "curso";
  };

  Sessao.prototype.feitas = function () {
    var self = this;
    return this.lista.filter(function (info) {
      var ea = self.estado.atividades[info.dados.id];
      return !!self.estado.azulejos[info.dados.id] || (ea && (ea.estado === "concluida" || ea.tentativa > 1));
    }).length;
  };

  /* ---------- Desafio final ---------- */

  Sessao.prototype.quantosDesafio = function () {
    return (this.c.desafio && this.c.desafio.quantos) || 12;
  };

  Sessao.prototype.desafioDesbloqueado = function () {
    return this.feitas() >= Math.ceil(this.lista.length / 2);
  };

  Sessao.prototype.faltamParaDesafio = function () {
    return Math.max(0, Math.ceil(this.lista.length / 2) - this.feitas());
  };

  Sessao.prototype.candidatosDesafio = function (tentativa) {
    var self = this;
    var saida = [];
    this.lista.forEach(function (info) {
      var dados = info.dados;
      var tipo = M.tipos[dados.tipo];
      if (!tipo || !tipo.desafio) return;
      var rng = U.rng(self.semente("desafio", tentativa, dados.id));
      saida.push({ id: dados.id, info: info, itens: M.itensDesafio(dados, rng) });
    });
    return saida;
  };

  /* Origens já vistas nesta sessão (ronda 0) ou em sessões anteriores. */
  Sessao.prototype.origensVistas = function (id) {
    var vistas = {};
    (this.estado.historico[id] || []).forEach(function (o) { vistas[o] = true; });
    var ea = this.estado.atividades[id];
    if (ea) {
      this.itensRonda(id, 0).forEach(function (it) {
        M.origensDe(it).forEach(function (o) { vistas[o] = true; });
      });
    }
    return vistas;
  };

  /* Escolha equilibrada por competência, de preferência entre itens ainda não vistos. */
  Sessao.prototype.escolherDesafio = function (tentativa) {
    var self = this;
    var rng = U.rng(this.semente("desafio", tentativa, "escolha"));
    var candidatos = this.candidatosDesafio(tentativa);
    var porComp = {};
    var ordemComp = [];
    candidatos.forEach(function (cand) {
      var vistas = self.origensVistas(cand.id);
      var novos = [];
      var velhos = [];
      cand.itens.forEach(function (it, k) {
        if (it.origem !== undefined && vistas[it.origem]) velhos.push(k); else novos.push(k);
      });
      cand.fila = rng.baralhar(novos).concat(rng.baralhar(velhos));
      var comp = cand.info.dados.competencia;
      if (!porComp[comp]) { porComp[comp] = []; ordemComp.push(comp); }
      porComp[comp].push(cand);
    });
    var total = 0;
    candidatos.forEach(function (cand) { total += cand.fila.length; });
    var quantos = Math.min(this.quantosDesafio(), total);
    var escolhidos = [];
    var vez = {};
    ordemComp.forEach(function (k) { vez[k] = 0; });
    var guarda = 0;
    while (escolhidos.length < quantos && guarda++ < 10000) {
      for (var i = 0; i < ordemComp.length && escolhidos.length < quantos; i++) {
        var comp = ordemComp[i];
        var lista = porComp[comp];
        for (var tentativas = 0; tentativas < lista.length; tentativas++) {
          var cand = lista[vez[comp] % lista.length];
          vez[comp]++;
          if (cand.fila.length) {
            escolhidos.push({ atividade: cand.id, indice: cand.fila.shift(), ordem: cand.info.ordem });
            break;
          }
        }
      }
    }
    escolhidos.sort(function (a, b) { return (a.ordem - b.ordem) || (a.indice - b.indice); });
    return escolhidos.map(function (e) { return { atividade: e.atividade, indice: e.indice }; });
  };

  Sessao.prototype.iniciarDesafio = function () {
    var anterior = this.estado.desafio;
    var tentativa = anterior ? anterior.tentativa + 1 : 1;
    this.estado.desafio = { tentativa: tentativa, estado: "curso", pos: 0, perguntas: this.escolherDesafio(tentativa), resultados: [] };
    this.cacheDesafio = null;
    this.progressoDesafio = null;
    this.gravar();
    return this.estado.desafio;
  };

  Sessao.prototype.itensDoDesafio = function () {
    var d = this.estado.desafio;
    if (!d) return [];
    if (this.cacheDesafio && this.cacheDesafio.tentativa === d.tentativa) return this.cacheDesafio.itens;
    var candidatos = {};
    this.candidatosDesafio(d.tentativa).forEach(function (c) { candidatos[c.id] = c.itens; });
    var itens = d.perguntas.map(function (p, i) {
      var it = candidatos[p.atividade] && candidatos[p.atividade][p.indice];
      if (it) it.chave = "d" + i;
      return it ? { atividade: p.atividade, item: it } : null;
    }).filter(Boolean);
    this.cacheDesafio = { tentativa: d.tentativa, itens: itens };
    return itens;
  };

  /* Pergunta atual do desafio, ou null. reabrir: a pergunta vai ser desenhada de novo. */
  Sessao.prototype.perguntaDesafio = function (reabrir) {
    var d = this.estado.desafio;
    if (!d || d.estado !== "curso") return null;
    var itens = this.itensDoDesafio();
    if (d.pos >= itens.length) return null;
    var q = itens[d.pos];
    if (reabrir || !this.progressoDesafio || this.progressoDesafio.chave !== q.item.chave) {
      var erros = (eObjeto(d.erros) && d.erros.chave === q.item.chave && eObjeto(d.erros.partes)) ? d.erros.partes : null;
      this.progressoDesafio = novoProgresso(q.item, erros);
      this.progressoDesafio.chave = q.item.chave;
    }
    return { atividade: q.atividade, dados: this.dados(q.atividade), item: q.item, indice: d.pos, total: itens.length };
  };

  /* Como responder: a resposta final é registada e gravada logo. */
  Sessao.prototype.responderDesafio = function (resposta) {
    var q = this.perguntaDesafio();
    if (!q) throw new Error("Nenhuma pergunta do desafio em curso");
    var d = this.estado.desafio;
    var prog = this.progressoDesafio;
    var tipo = M.tipo(q.dados.tipo);
    var r = M.aplicarCorrecao(tipo, q.item, prog, resposta, 1);
    r.item = q.item;
    if (r.fim) {
      r.estado = "registado";
      var resumo = resumirProgresso(q.item, prog);
      resumo.atividade = q.atividade;
      resumo.certo = Object.keys(resumo.partes).every(function (k) { return resumo.partes[k].p; }) ? 1 : 0;
      this.passarDesafio(resumo);
    } else if (r.erroAgora) {
      d.erros = errosDoProgresso(q.item, prog);
      this.gravar();
    }
    return r;
  };

  Sessao.prototype.passarDesafio = function (resumo) {
    var d = this.estado.desafio;
    d.resultados[d.pos] = resumo;
    d.pos++;
    delete d.erros;
    this.progressoDesafio = null;
    if (d.pos >= this.itensDoDesafio().length) {
      d.estado = "concluida";
      var res = this.resultadoDesafio();
      var novo = (res.total > 0 && res.certos === res.total) ? "dourado" : "normal";
      if (this.estado.azulejos.__desafio !== "dourado") this.estado.azulejos.__desafio = novo;
    }
    this.gravar();
  };

  /* Salta a pergunta atual (conta como não respondida). Devolve true se o desafio acabou. */
  Sessao.prototype.saltarDesafio = function () {
    if (this.perguntaDesafio()) this.passarDesafio(null);
    return this.avancarDesafio();
  };

  /* Depois de uma pergunta terminada: o desafio acabou? (O registo é feito em responderDesafio.) */
  Sessao.prototype.avancarDesafio = function () {
    var d = this.estado.desafio;
    return !d || d.estado !== "curso" || d.pos >= this.itensDoDesafio().length;
  };

  Sessao.prototype.resultadoDesafio = function () {
    var d = this.estado.desafio;
    if (!d) return { certos: 0, total: 0 };
    var certos = 0;
    d.resultados.forEach(function (r) { if (r) certos += r.certo; });
    return { certos: certos, total: this.itensDoDesafio().length };
  };

  /* Perguntas falhadas do desafio, com o resumo do tipo (enunciado, resposta, explicação). */
  Sessao.prototype.errosDesafio = function () {
    var d = this.estado.desafio;
    var self = this;
    if (!d) return [];
    var itens = this.itensDoDesafio();
    var saida = [];
    d.resultados.forEach(function (r, i) {
      if (r && !r.certo && itens[i]) {
        var dados = self.dados(itens[i].atividade);
        var resumo = M.tipo(dados.tipo).resumo(itens[i].item);
        saida.push({ numero: i + 1, atividade: dados, resumo: resumo });
      }
    });
    return saida;
  };

  /* ---------- Balanço ---------- */

  M.nivelBalanco = function (certos, total) {
    if (!total) return "cinzento";
    var p = certos / total;
    if (p >= 0.8) return "verde";
    if (p >= 0.5) return "amarelo";
    return "vermelho";
  };

  Sessao.prototype.balanco = function () {
    var self = this;
    var porComp = {};
    var leitura = {};
    Object.keys(this.c.competencias).forEach(function (k) {
      porComp[k] = { chave: k, rotulo: self.c.competencias[k], certos: 0, total: 0, atividades: [] };
    });
    function somar(comp, resultado) {
      Object.keys(resultado.partes).forEach(function (k) {
        if (porComp[comp]) { porComp[comp].total++; porComp[comp].certos += resultado.partes[k].p; }
        if (resultado.nivel) {
          leitura[resultado.nivel] = leitura[resultado.nivel] || { certos: 0, total: 0 };
          leitura[resultado.nivel].total++;
          leitura[resultado.nivel].certos += resultado.partes[k].p;
        }
      });
    }
    this.lista.forEach(function (info) {
      var a = info.dados;

        sessao = new M.Sessao(conteudo, armazem, opcoes);
        UI.sessao = sessao;
        UI.ecra = null;
        rota();
      } catch (e2) {
        erroFatal(e2);
      }
    }
  };

  function erroFatal(e) {
    if (window.console) console.error(e);
    if (!raiz) return;
    C.limpar(raiz);
    raiz.appendChild(C.el("div", { "class": "erro-fatal" }, [C.el("p", { text: M.t("geral.erroFicha") })]));
  }

  /* Um erro numa mudança de ecrã não deixa a criança num ecrã morto: volta-se ao início. */
  function protegido(fn) {
    return function () {
      try {
        return fn.apply(null, arguments);
      } catch (e) {
        if (window.console) console.error(e);
        UI.erros = (UI.erros || 0) + 1;
        try {
          ecraInicio();
          C.modal({ titulo: M.t("geral.erroTitulo"), corpo: [C.el("p", { text: M.t("geral.erroAtividade") })] });
        } catch (e2) {
          erroFatal(e2);
        }
      }
    };
  }

  /* «#adulto» abre a página do adulto; «#adulto-<id>» abre-a no texto dessa atividade. */
  function hashAdulto() { return /^#adulto(-|$)/.test(location.hash); }

  function rota() {
    if (hashAdulto()) ecraAdulto(location.hash.slice(1));
    else if (UI.ecra === "adulto" || !UI.ecra) ecraInicio();
  }

  function irParaAdulto() {
    if (location.hash === "#adulto") ecraAdulto();
    else location.hash = "adulto";
  }

  /*
   * Endereço publicado da ficha, para os códigos QR: o próprio endereço quando a ficha foi
   * aberta na Internet; senão, o endereço gravado na montagem (data-publicacao, sem o
   * protocolo, para não parecer um recurso externo à verificação de montar.js). Sem nenhum
   * dos dois (ficheiro local não publicado), não há código QR.
   */
  function enderecoPublicado(ancora) {
    var base = null;
    try {
      if (/^https?:$/.test(location.protocol)) base = location.origin + location.pathname;
      else if (publicacao) base = "https:/" + "/" + publicacao;
    } catch (e) { base = null; }
    return base ? base + (ancora ? "#" + ancora : "") : null;
  }

  function caixaQR(ancora, texto, classe) {
    var endereco = enderecoPublicado(ancora);
    if (!endereco || !M.qr) return null;
    var svg = null;
    try { svg = M.qr.svg(endereco, M.t("qr.rotulo")); } catch (e) { svg = null; }
    if (!svg) return null;
    return C.el("div", { "class": ["caixa-qr", classe], "data-qr": endereco }, [svg, C.el("p", { text: texto })]);
  }

  function sairDoAdulto() {
    if (location.hash) {
      if (window.history && history.replaceState) {
        history.replaceState(null, "", location.pathname + location.search);
        ecraInicio();
      } else {
        location.hash = "";
      }
    } else {
      ecraInicio();
    }
  }

  function novoEcra(nome, classes) {
    C.fecharMenu();
    desarmarAvanco();
    UI.ecra = nome;
    UI.atual = null;
    C.limpar(raiz);
    document.body.setAttribute("data-ecra", nome);
    document.body.removeAttribute("data-tipo");
    var el = C.el("div", { "class": ["ecra", "ecra-" + nome].concat(classes || []) });
    raiz.appendChild(el);
    try { window.scrollTo(0, 0); } catch (e) { /* nada */ }
    return el;
  }

  function generoTema(tema) {
    return (M.textos.temas[tema] && M.textos.temas[tema].genero) || "f";
  }

  function rotuloEtapa(i) {
    var tema = conteudo.tema || "nenhum";
    return M.t("temas." + tema + ".etapa", { ordinal: U.ordinalAbrev(i + 1, generoTema(tema)) });
  }

  /* ---------------------------------------------------------------
   * Início
   * --------------------------------------------------------------- */

  var ICONE_ESTADO = { nova: "traco", curso: "seguinte", feita: "certo", azulejo: "estrela", dourado: "estrela" };

  function cartaoAtividade(a) {
    var estado = sessao.estadoCartao(a.id);
    var filhos = [
      C.el("span", { "class": "cartao-icone" }, [D.icone(a.tipo)]),
      C.el("span", { "class": "cartao-corpo" }, [
        C.el("span", { "class": "cartao-titulo", text: a.titulo }),
        C.el("span", { "class": "cartao-estado" }, [D.icone(ICONE_ESTADO[estado]), C.el("span", { text: M.t("inicio.estado." + estado) })])
      ])
    ];
    if (estado === "azulejo" || estado === "dourado") {
      filhos.push(C.el("span", { "class": "cartao-azulejo" }, [D.azulejo(a.id, sessao.estado.azulejos[a.id])]));
    }
    return C.botao(filhos, protegido(function () { abrirAtividade(a.id); }), "cartao-atividade estado-" + estado, {
      "data-atividade": a.id,
      title: M.t("tipos." + a.tipo + ".nome")
    });
  }

  function desenharPainel(festa) {
    var casas = sessao.painel();
    var ganhos = casas.filter(function (c) { return c.azulejo; }).length;
    var completo = ganhos === casas.length;
    var grelha = C.el("div", { "class": "painel-grelha" });
    casas.forEach(function (c, i) {
      var az = D.azulejo(c.desafio ? "desafio-" + conteudo.id : c.id, c.azulejo, { desafio: c.desafio });
      var casa = C.el("span", {
        "class": ["painel-casa", c.azulejo ? "ganha" : "", c.desafio ? "casa-desafio" : ""],
        title: c.titulo,
        role: "img",
        "aria-label": c.titulo + " — " + (c.azulejo ? M.t("inicio.estado." + (c.azulejo === "dourado" ? "dourado" : "azulejo")) : M.t("inicio.estado.nova")),
        style: { animationDelay: (i * 60) + "ms" }
      }, [az]);
      grelha.appendChild(casa);
    });
    var painel = C.el("section", { "class": ["painel", completo ? "completo" : "", completo && festa ? "festa" : ""], "aria-labelledby": "titulo-painel" }, [
      C.el("div", { "class": "painel-cabecalho" }, [
        C.el("h2", { id: "titulo-painel", text: M.t("geral.oTeuPainel") }),
        C.el("span", { "class": "painel-contagem", text: ganhos + " / " + casas.length })
      ]),
      grelha,
      C.el("p", { "class": "painel-ajuda", text: completo ? M.t("inicio.painelCompleto") : M.t("inicio.painelAjuda") })
    ]);
    if (completo && festa) {
      var confetes = C.el("div", { "class": "confetes", "aria-hidden": "true" });
      for (var k = 0; k < 18; k++) confetes.appendChild(C.el("i", { style: { left: (5 + k * 5.3) + "%", animationDelay: (k % 6) * 70 + "ms" } }));
      painel.appendChild(confetes);
    }
    return painel;
  }

  function cartaoDesafio() {
    var aberto = sessao.desafioDesbloqueado();
    var d = sessao.estado.desafio;
    var linhas = [C.el("span", { "class": "cartao-titulo", text: M.t("geral.desafioFinal") })];
    if (!aberto) {
      linhas.push(C.el("span", { "class": "cartao-estado" }, [D.icone("cadeado"), C.el("span", { text: M.tn("inicio.desafioBloqueado", sessao.faltamParaDesafio()) })]));
    } else if (d && d.estado === "concluida") {
      var r = sessao.resultadoDesafio();
      linhas.push(C.el("span", { "class": "cartao-estado" }, [D.icone("certo"), C.el("span", { text: M.t("inicio.desafioFeito", { certos: r.certos, total: r.total }) })]));
    } else {
      linhas.push(C.el("span", { "class": "cartao-estado" }, [D.icone("seguinte"), C.el("span", { text: M.t("inicio.desafioPronto", { n: sessao.quantosDesafio() }) })]));
    }
    var b = C.botao([
      C.el("span", { "class": "cartao-icone" }, [D.icone(aberto ? "desafio" : "cadeado")]),
      C.el("span", { "class": "cartao-corpo" }, linhas)
    ], protegido(function () { if (aberto) ecraDesafioIntro(); }), "cartao-atividade cartao-desafio" + (aberto ? "" : " bloqueado"), {
      "data-desafio": "1",
      "aria-disabled": aberto ? "false" : "true"
    });
    return b;
  }

  function ecraInicio() {
    var el = novoEcra("inicio");
    var tema = conteudo.tema || "nenhum";
    el.appendChild(C.el("header", { "class": "cabecalho-inicio tema-" + tema }, [
      D.tema(tema),
      C.el("div", { "class": "titulo-ficha" }, [
        C.el("h1", { text: conteudo.titulo }),
        C.el("p", { text: M.t("temas." + tema + ".frase") })
      ])
    ]));
    var completo = sessao.painelCompleto();
    el.appendChild(desenharPainel(completo && !UI.festa));
    if (completo && !UI.festa) M.sons.tocar("festa");
    if (completo) UI.festa = true;

    conteudo.dominios.forEach(function (d, i) {
      var grelha = C.el("div", { "class": "grelha-cartoes" }, d.atividades.map(cartaoAtividade));
      el.appendChild(C.el("section", { "class": "dominio", "aria-labelledby": "dominio-" + i }, [
        C.el("h2", { "class": "dominio-titulo", id: "dominio-" + i }, [
          C.el("span", { "class": "dominio-etapa", text: rotuloEtapa(i) }),
          C.el("span", { text: d.titulo })
        ]),
        grelha
      ]));
    });

    el.appendChild(C.el("section", { "class": "dominio dominio-desafio" }, [C.el("div", { "class": "grelha-cartoes" }, [cartaoDesafio()])]));

    var algo = Object.keys(sessao.estado.atividades).length > 0 || !!sessao.estado.desafio;
    var rodape = C.el("footer", { "class": "rodape-inicio" }, [
      algo ? C.botaoIcone("balanco", M.t("geral.balanco"), ecraBalanco, "discreto", { "data-acao": "balanco" }) : null,
      C.botaoIcone("adulto", M.t("geral.paraOAdulto"), irParaAdulto, "discreto", { "data-acao": "adulto" }),
      botaoSom(),
      C.botaoIcone("recomecar", M.t("geral.recomecar"), pedirRecomecar, "discreto", { "data-acao": "recomecar" })
    ]);
    el.appendChild(rodape);
    if (!armazem.disponivel) el.appendChild(C.el("p", { "class": "aviso-guardar", text: M.t("geral.semGuardar") }));
  }

  /* Liga ou desliga os sons (preferência comum a todas as fichas). */
  function botaoSom() {
    var b = null;
    function pintar() {
      var on = M.sons.ligado();
      C.limpar(b);
      b.appendChild(D.icone(on ? "som" : "semSom"));
      b.appendChild(C.el("span", { text: M.t(on ? "geral.somLigado" : "geral.somDesligado") }));
      b.setAttribute("aria-pressed", on ? "true" : "false");
    }
    b = C.botao([], function () { M.sons.alternar(); pintar(); }, "discreto com-icone", { "data-acao": "som", title: M.t("geral.somAjuda") });
    pintar();
    return b;
  }

  function pedirRecomecar() {
    C.modal({
      titulo: M.t("recomecar.titulo"),
      corpo: [C.el("p", { text: M.t("recomecar.explica") })],
      botoes: [
        { texto: M.t("recomecar.nao"), principal: true },
        { texto: M.t("recomecar.sim"), acao: function () { sessao.recomecar(); UI.festa = false; ecraInicio(); }, atributos: { "data-acao": "confirmar-recomecar" } }
      ]
    });
  }

  function abrirAtividade(id) {
    var ea = sessao.estadoAtividade(id);
    if (ea && sessao.rondaTerminada(id)) ecraFim(id, false);
    else ecraAtividade(id);
  }

  function abrirLembra(lembra) {
    var corpo = [C.formatado(lembra.regra, "p", { "class": "lembra-regra" })];
    if (lembra.exemplo) {
      corpo.push(C.el("div", { "class": "lembra-exemplo" }, [
        C.el("span", { "class": "lembra-rotulo", text: M.t("geral.exemplo") }),
        C.formatado(lembra.exemplo, "p")
      ]));
    }
    C.modal({ titulo: M.t("geral.lembraTe"), corpo: corpo, classe: "modal-lembra" });
  }

  /* ---------------------------------------------------------------
   * Retorno (faixa em baixo)
   * --------------------------------------------------------------- */

  var SOM_ESTADO = { errado: "ver", tentar: "tentar", parcial: "ver", registado: "registado", continuar: "parte" };

  /*
   * Avançar sem procurar o botão: depois da resposta final, um clique em qualquer sítio
   * (fora da barra da atividade) ou uma tecla passa à pergunta seguinte. Uma pequena espera
   * impede que o próprio clique ou o Enter da resposta salte a explicação; quando a resposta
   * certa é mostrada, a espera é maior, para dar tempo de a ver.
   */
  var avanco = null;
  var ESPERA_CERTO = 350;
  var ESPERA_VER = 1100;
  var TECLAS_IGNORADAS = /^(Tab|Shift|Control|Alt|AltGraph|Meta|OS|CapsLock|NumLock|ScrollLock|Escape|Fn|FnLock|Hyper|Super|ContextMenu|PrintScreen|Dead|Unidentified|Process|F\d{1,2}|ArrowUp|ArrowDown|ArrowLeft|ArrowRight|PageUp|PageDown|Home|End|Audio\w*|Volume\w*|Media\w*)$/;

  function armarAvanco(fn, espera, botao) {
    avanco = { fn: fn, desde: Date.now() + espera, botao: botao };
  }

  function desarmarAvanco() { avanco = null; }

  function haJanela() { return !!document.querySelector(".modal-fundo, .menu-escolha"); }

  function cliqueGlobal(ev) {
    var a = avanco;
    if (!a || Date.now() < a.desde || haJanela()) return;
    var alvo = ev.target;
    if (alvo && alvo.closest && alvo.closest(".barra-atividade")) return;
    if (alvo === a.botao || (a.botao && a.botao.contains(alvo))) return;
    a.fn();
  }

  function teclaGlobal(ev) {
    var a = avanco;
    if (!a || Date.now() < a.desde || ev.repeat || ev.ctrlKey || ev.metaKey || ev.altKey || haJanela()) return;
    if (TECLAS_IGNORADAS.test(ev.key || "")) return;
    var foco = document.activeElement;
    if ((ev.key === "Enter" || ev.key === " ") && foco && foco !== a.botao && foco.closest &&
        foco.closest(".barra-atividade")) return;
    ev.preventDefault();
    a.fn();
  }

  function mostrarRetorno(faixa, r, ctx, aoContinuar) {
    C.limpar(faixa);
    var som = r.estado === "certo" ? (r.segundaTentativa ? "certoSegunda" : "certo") : SOM_ESTADO[r.estado];
    if (som) M.sons.tocar(som);
    faixa.className = "retorno";
    var msg = null;
    var extra = null;
    var icone = null;
    var classe = "";
    var botao = null;
    switch (r.estado) {
      case "certo":
        msg = M.tVariante(r.segundaTentativa ? "retorno.certoSegunda" : "retorno.certo", ctx.rng, UI.ultimaMensagem);
        UI.ultimaMensagem = msg;
        extra = r.explicacao;
        icone = D.andorinha("andorinha-retorno");
        classe = "certo";
        botao = M.t("geral.continuar");
        break;
      case "errado":
        msg = M.t("retorno.veResposta");
        extra = r.explicacao;
        icone = D.icone("olho");
        classe = "ver";
        botao = M.t("geral.continuar");
        break;
      case "tentar":
        msg = (ctx.item.partes.length > 1 && r.nTentar && !ctx.item.sequencial) ? M.tn("retorno.quaseVarios", r.nTentar) : M.t("retorno.quase");
        extra = r.dica;
        icone = D.icone("lampada");
        classe = "quase";
        break;
      case "parcial":
        msg = M.t("retorno.veRespostaParte");
        extra = r.explicacao;
        icone = D.icone("olho");
        classe = "ver";
        break;
      case "registado":
        msg = M.t("retorno.registado");
        icone = D.icone("certo");
        classe = "registado";
        botao = M.t("geral.seguinte");
        break;
      default:
        if (r.detalhe && r.detalhe.mensagem) {
          msg = r.detalhe.mensagem;
          icone = D.icone("seguinte");
          classe = "continuar";
        }
    }
    if (!msg) return;
    faixa.classList.add("visivel");
    if (classe) faixa.classList.add(classe);
    faixa.appendChild(C.el("div", { "class": "retorno-icone" }, [icone]));
    var texto = C.el("div", { "class": "retorno-texto" }, [C.formatado(msg, "p", { "class": "retorno-mensagem" })]);
    if (extra) texto.appendChild(C.formatado(extra, "p", { "class": "retorno-extra" }));
    faixa.appendChild(texto);
    if (botao) {
      var feito = false;
      var umaVez = function () {
        if (feito) return;
        feito = true;
        desarmarAvanco();
        M.sons.tocar("passo");
        aoContinuar();
      };
      var b = C.botao(botao, umaVez, "principal botao-continuar", { "data-acao": "continuar" });
      faixa.appendChild(C.el("div", { "class": "retorno-acao" }, [
        b,
        C.el("p", { "class": "retorno-dica-avancar", "aria-hidden": "true" }, [
          C.el("span", { "class": "com-rato", text: M.t("retorno.avancarRato") }),
          C.el("span", { "class": "com-toque", text: M.t("retorno.avancarToque") })
        ])
      ]));
      armarAvanco(umaVez, (r.estado === "certo" || r.estado === "registado") ? ESPERA_CERTO : ESPERA_VER, b);
      setTimeout(function () { C.focar(b); }, 30);
    }
  }

  /* ---------------------------------------------------------------
   * Atividade
   * --------------------------------------------------------------- */

  function pontos(n, atual) {
    var caixa = C.el("div", { "class": "pontos", role: "img", "aria-label": M.t("atividade.item", { i: Math.min(atual + 1, n), n: n }) });
    for (var i = 0; i < n; i++) {
      caixa.appendChild(C.el("span", { "class": ["ponto", i < atual ? "feito" : "", i === atual ? "atual" : ""] }));
    }
    return caixa;
  }

  function criarCtx(modo, dados, item, area) {
    return {
      modo: modo,
      desafio: modo === "desafio",
      dados: dados,
      item: item,
      area: area,
      t: M.t,
      tn: M.tn,
      util: U,
      comp: C,
      desenhos: D,
      imagem: M.imagem,
      rng: U.rng(U.semente(conteudo.id, sessao.estado.sessao, dados.id, item.chave, "ecra")),
      terminado: false,
      ultimo: null,
      responder: null
    };
  }

  /* Desenha o item. Se o tipo falhar, a criança não fica presa: uma mensagem e um botão para passar à frente. */
  function desenharItem(tipo, item, area, ctx, dados, aoSaltar) {
    UI.atual = { tipo: tipo, item: item, area: area, ctx: ctx, dados: dados };
    try {
      tipo.desenhar(item, area, ctx);
    } catch (e) {
      if (window.console) console.error(e);
      UI.erros = (UI.erros || 0) + 1;
      UI.atual = null;
      ctx.terminado = true;
      C.limpar(area);
      area.appendChild(C.el("div", { "class": "erro-item" }, [
        C.el("p", { text: M.t("geral.erroPergunta") }),
        C.botao(M.t("geral.continuar"), protegido(aoSaltar), "principal", { "data-acao": "saltar" })
      ]));
    }
  }

  function ecraAtividade(id) {
    var dados = sessao.dados(id);
    var tipo = M.tipo(dados.tipo);
    var item = sessao.itemAtual(id, true);
    if (!item) { ecraFim(id, true); return; }
    var ea = sessao.estadoAtividade(id);
    var itens = sessao.itensRonda(id, ea.ronda);
    var el = novoEcra("atividade", ["tipo-" + dados.tipo, tipo.plateau ? "plateau" : ""]);
    document.body.setAttribute("data-tipo", dados.tipo);
    el.appendChild(C.el("header", { "class": "barra-atividade" }, [
      C.botaoIcone("voltar", M.t("geral.voltarInicio"), ecraInicio, "discreto voltar", { "data-acao": "inicio" }),
      C.el("div", { "class": "titulo-atividade" }, [
        C.el("h1", { text: dados.titulo }),
        ea.ronda > 0 ? C.el("span", { "class": "etiqueta-ronda", text: M.t("atividade.segundaRonda") }) : null
      ]),
      itens.length > 1 ? pontos(itens.length, ea.pos) : C.el("span"),
      dados.lembra ? C.botaoIcone("lampada", M.t("geral.lembraTe"), function () { abrirLembra(dados.lembra); }, "lembra", { "data-acao": "lembra" }) : C.el("span")
    ]));
    if (!item.semInstrucao) el.appendChild(C.formatado(dados.instrucao, "p", { "class": "instrucao" }));
    var area = C.el("div", { "class": "area-item", tabindex: "-1" });
    var faixa = C.el("div", { "class": "retorno", role: "status", "aria-live": "polite" });
    var pede = false;
    try { pede = !!(tipo.pedeAdulto && tipo.adulto && tipo.pedeAdulto(item)); } catch (e) { pede = false; }
    var qr = pede ? caixaQR("adulto-" + dados.id, M.t("qr.atividade"), "qr-atividade") : null;
    if (qr) el.appendChild(qr);
    el.appendChild(area);
    el.appendChild(faixa);
    var ctx = criarCtx("atividade", dados, item, area);
    ctx.responder = function (resposta) {
      if (ctx.terminado) return ctx.ultimo;
      var r = sessao.responder(id, resposta);
      ctx.ultimo = r;
      UI.ultimoRetorno = r;
      if (r.fim) { ctx.terminado = true; area.classList.add("terminado"); }
      mostrarRetorno(faixa, r, ctx, protegido(seguinte));
      return r;
    };
    function seguinte() {
      if (sessao.avancar(id)) ecraFim(id, true); else ecraAtividade(id);
    }
    desenharItem(tipo, item, area, ctx, dados, function () { sessao.saltar(id); seguinte(); });

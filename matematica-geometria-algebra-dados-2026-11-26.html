    v.campos(it, c, ["texto", "erros", "dica", "explicacao"]);
    v.dicaExplicacao(it, c);
    if (!v.texto(it, "texto", c + ".texto", { obrigatorio: true })) return;
    if (/\*\*|[{}<>]/.test(it.texto)) { v.erro(c + ".texto", "pas de mise en forme (**), ni de { } < > dans le texte du robot."); return; }
    var lista = pedacos(it.texto);
    if (lista.length > 45) v.aviso(c + ".texto", lista.length + " mots : un texte de 15 à 40 mots suffit.");
    if (!v.lista(it, "erros", c + ".erros", { obrigatorio: true, min: 1, max: 5 })) return;
    var posicoes = {};
    it.erros.forEach(function (e, k) {
      var ce = c + ".erros[" + k + "]";
      if (!e || typeof e !== "object" || Array.isArray(e)) { v.erro(ce, "objet attendu : { \"palavra\": \"á\", \"correcao\": [\"à\"] }."); return; }
      v.campos(e, ce, ["palavra", "posicao", "correcao", "distratores", "explicacao"]);
      v.texto(e, "explicacao", ce + ".explicacao");
      if ((e.palavra === undefined) === (e.posicao === undefined)) { v.erro(ce, "indique le mot faux avec « palavra » (le mot tel qu'il est écrit) ou « posicao » (sa place), pas les deux."); return; }
      if (e.palavra !== undefined && !v.texto(e, "palavra", ce + ".palavra")) return;
      if (e.posicao !== undefined && typeof e.posicao !== "number") { v.erro(ce + ".posicao", "nombre entier attendu."); return; }
      var l = localizar(lista, e);
      if (l.erro) { v.erro(ce, l.erro); return; }
      if (posicoes[l.pos] !== undefined) { v.erro(ce, "même mot que erros[" + posicoes[l.pos] + "]."); return; }
      posicoes[l.pos] = k;
      var correcao = listaCorrecao(e, v, ce + ".correcao");
      if (!correcao) return;
      var original = lista[l.pos];
      if (aceiteTexto(original, original, correcao)) { v.erro(ce + ".correcao", "la correction ne change rien à « " + original + " » : le mot du texte doit être faux."); return; }
      validarDistratores(e, v, ce + ".distratores", function (x) { return aceiteTexto(x, original, correcao); });
    });
    if (Object.keys(posicoes).length >= lista.length) v.erro(c + ".erros", "tous les mots sont des erreurs : il faut aussi des mots justes.");
  }

  function validarLista(it, v, c) {
    v.campos(it, c, ["linhas", "dica", "explicacao"]);
    v.dicaExplicacao(it, c);
    if (!v.lista(it, "linhas", c + ".linhas", { obrigatorio: true, min: 3, max: 8 })) return;
    var falsas = 0;
    var verdadeiras = 0;
    var vistas = {};
    it.linhas.forEach(function (l, k) {
      var cl = c + ".linhas[" + k + "]";
      if (!l || typeof l !== "object" || Array.isArray(l)) { v.erro(cl, "objet attendu : { \"linha\": \"6 × 7 = **48**\", \"certa\": false, \"correcao\": \"42\" }."); return; }
      v.campos(l, cl, ["linha", "certa", "correcao", "distratores", "explicacao"]);
      v.texto(l, "explicacao", cl + ".explicacao");
      if (!v.texto(l, "linha", cl + ".linha", { obrigatorio: true })) return;
      var kl = U.normalizar(U.semMarcas(l.linha), { exato: true });
      if (vistas[kl] !== undefined) v.erro(cl, "même ligne que linhas[" + vistas[kl] + "].");
      vistas[kl] = k;
      if (l.certa === undefined) { v.erro(cl + ".certa", "champ obligatoire manquant (true ou false)."); return; }
      if (!v.booleano(l, "certa", cl + ".certa")) return;
      if (l.certa) {
        verdadeiras++;
        if (l.correcao !== undefined) v.erro(cl + ".correcao", "la ligne est juste : retire correcao.");
        if (l.distratores !== undefined) v.erro(cl + ".distratores", "la ligne est juste : retire distratores.");
        return;
      }
      falsas++;
      var neg = U.negritos(l.linha);
      if (neg.length !== 1) { v.erro(cl + ".linha", "une ligne fausse met en **gras** la partie fausse, une seule fois (par exemple « 6 × 7 = **48** ») : c'est elle que l'enfant corrige."); return; }
      var correcao = listaCorrecao(l, v, cl + ".correcao");
      if (!correcao) return;
      if (U.aceite(neg[0], correcao)) v.erro(cl + ".correcao", "la correction est égale à la partie en gras : la ligne n'est pas fausse.");
      validarDistratores(l, v, cl + ".distratores", function (x) { return U.aceite(x, correcao); });
    });
    if (it.linhas.length >= 3 && (!falsas || !verdadeiras)) v.erro(c + ".linhas", "il faut des lignes justes et des lignes fausses (" + verdadeiras + " juste(s), " + falsas + " fausse(s)).");
  }

  function validar(d, v) {
    if (d.modo !== undefined && !v.escolhaEntre(d, "modo", "modo", MODOS)) return;
    if (d.modo === "algoritmo") {
      var g = M.mat.validarGerar(d, v, { algarismos: { t: "int", min: 2, max: 4 }, parcelas: { t: "int", min: 2, max: 3 } });
      if (!g) return;
      var n = 0;
      var vistos = {};
      var rng = U.rng("capacidade-detetive");
      for (var k = 0; k < 200; k++) { var it = gerarAlgoritmo(g, rng); if (it && !vistos[it.assinatura]) { vistos[it.assinatura] = true; n++; } }
      M.mat.verificarCapacidade(d, v, n, 3);
      return;
    }
    if (d.gerar !== undefined) { v.erro("gerar", "seulement pour le modo algoritmo."); return; }
    if (!v.lista(d, "itens", "itens", { obrigatorio: true, min: 1 })) return;
    var modo = d.modo || "texto";
    d.itens.forEach(function (it, i) {
      var c = "itens[" + i + "]";
      if (!it || typeof it !== "object" || Array.isArray(it)) { v.erro(c, "objet attendu."); return; }
      if (modo === "lista") validarLista(it, v, c); else validarTexto(it, v, c);
    });
    v.mostrarItens(d, d.itens.length, { padrao: 3 });
  }

  /* ---------------------------------------------------------------
   * Preparação
   * --------------------------------------------------------------- */

  function opcoesDe(obj, correcao, rng) {
    if (!obj.distratores) return null;
    return rng.baralhar([correcao[0]].concat(obj.distratores));
  }

  function prepararItem(d, raw, rng, origem) {
    var item = { origem: origem, modo: d.modo || "texto", dica: raw.dica, explicacao: raw.explicacao, erros: [] };
    if (item.modo === "lista") {
      item.unidades = raw.linhas.map(function (l, k) {
        var u = { i: k, texto: U.semMarcas(l.linha) };
        if (!l.certa) {
          var partes = /^([\s\S]*?)\*\*([^*]+?)\*\*([\s\S]*)$/.exec(l.linha);
          u.antes = U.semMarcas(partes[1]);
          u.segmento = partes[2];
          u.depois = U.semMarcas(partes[3]);
          var correcao = typeof l.correcao === "string" ? [l.correcao] : l.correcao.slice();
          item.erros.push({ id: "e" + k, pos: k, original: partes[2], correcao: correcao, opcoes: opcoesDe(l, correcao, rng), explicacao: l.explicacao });
        }
        return u;
      });
    } else {
      var lista = pedacos(raw.texto);
      item.unidades = lista.map(function (p, k) { return { i: k, texto: p }; });
      raw.erros.forEach(function (e, k) {
        var pos = localizar(lista, e).pos;
        var correcao = typeof e.correcao === "string" ? [e.correcao] : e.correcao.slice();
        item.erros.push({ id: "e" + k, pos: pos, original: lista[pos], correcao: correcao, opcoes: opcoesDe(e, correcao, rng), explicacao: e.explicacao });
      });
      item.erros.sort(function (a, b) { return a.pos - b.pos; });
    }
    item.partes = item.erros.map(function (e) { return e.id; });
    return item;
  }

  /* Adição em pé feita pelo robô, que se esquece do transporte de uma coluna. */
  function contaRobo(parcelas, esquecida) {
    var nc = Math.max.apply(null, parcelas.map(function (p) { return String(p).length; }));
    var vai = 0;
    var digs = [];
    var vais = [];
    var passos = [];
    for (var i = 0; i < nc || vai; i++) {
      var termos = (vai ? [vai] : []).concat(parcelas.filter(function (p) { return String(p).length > i; }).map(function (p) { return Math.floor(p / Math.pow(10, i)) % 10; }));
      var soma = termos.reduce(function (a, b) { return a + b; }, 0);
      digs[i] = soma % 10;
      passos[i] = { termos: termos, soma: soma };
      vai = (i === esquecida) ? 0 : Math.floor(soma / 10);
      vais[i + 1] = vai;
      if (i > 6) break;
    }
    return { digitos: digs, vais: vais, passos: passos, nc: nc };
  }

  function gerarAlgoritmo(g, rng) {
    var alg = g.algarismos || 3;
    var np = g.parcelas || 2;
    function aleat(k) { return rng.inteiro(Math.pow(10, k - 1), Math.pow(10, k) - 1); }
    for (var tent = 0; tent < 60; tent++) {
      var parcelas = [aleat(alg)];
      for (var p = 1; p < np; p++) parcelas.push(aleat(rng.inteiro(Math.max(1, alg - 1), alg)));
      var certa = contaRobo(parcelas, -1);
      if (certa.digitos.length > 4) continue;
      var colunas = [];
      for (var i = 0; i < certa.nc - 1; i++) if (certa.vais[i + 1]) colunas.push(i);
      if (!colunas.length) continue;
      var esq = rng.escolher(colunas);
      var robo = contaRobo(parcelas, esq);
      if (robo.digitos.length !== certa.digitos.length) continue;
      var nc = certa.digitos.length;
      var erros = [];
      for (var j = 0; j < nc; j++) {
        if (robo.digitos[j] !== certa.digitos[j]) {
          var ps = certa.passos[j];
          erros.push({ id: "e" + (nc - 1 - j), pos: nc - 1 - j, original: String(robo.digitos[j]), correcao: [String(certa.digitos[j])], opcoes: null,
            explicacao: M.t("tipos.detetive.algoritmoErro", { col: NOME_COL[j], conta: ps.termos.join(" + "), s: ps.soma, d: certa.digitos[j] }) });
        }
      }
      if (!erros.length) continue;
      var sinalLinhas = parcelas.map(function (x) { var s = String(x); while (s.length < nc) s = " " + s; return s.split("").map(function (c) { return c === " " ? null : Number(c); }); });
      var item = {
        modo: "algoritmo",
        assinatura: parcelas.join("+") + "/" + esq,
        parcelas: parcelas,
        colunas: nc,
        linhas: sinalLinhas,
        vais: robo.vais,
        unidades: robo.digitos.slice().reverse().map(function (d, k) { return { i: k, texto: String(d) }; }),
        erros: erros.sort(function (a, b) { return a.pos - b.pos; }),
        resultado: certa.digitos.reduce(function (acc, d, k) { return acc + d * Math.pow(10, k); }, 0),
        explicacao: M.t("tipos.detetive.algoritmoExp", { col: NOME_COL[esq + 1], op: parcelas.join(" + "), r: certa.digitos.slice().reverse().join("") })
      };
      item.partes = item.erros.map(function (e) { return e.id; });
      return item;
    }
    return null;
  }

  function erroPorId(item, id) { return item.erros.filter(function (e) { return e.id === id; })[0] || null; }
  function erroNaPosicao(item, pos) { return item.erros.filter(function (e) { return e.pos === pos; })[0] || null; }

  /* Texto corrigido de uma unidade (para mostrar e para os resumos). */
  function corrigido(item, e) {
    if (item.modo === "algoritmo") return e.correcao[0];
    if (item.modo === "lista") {
      var u = item.unidades[e.pos];
      return u.antes + e.correcao[0] + u.depois;
    }
    var c = e.correcao[0];
    if (nucleo(c) !== nucleo(e.original) && nucleo(c) === espacos(c)) {
      /* Correção só das letras: guarda a pontuação à volta do pedaço original. */
      var m = /^([^\p{L}\p{N}]*)[\s\S]*?([^\p{L}\p{N}]*)$/u.exec(e.original);
      return m[1] + c + m[2];
    }
    return c;
  }

  function explicacaoErro(item, e) {
    if (item.modo === "algoritmo") return e.explicacao;
    return e.explicacao || M.t("tipos.detetive.correcao", { errado: item.modo === "lista" ? U.semMarcas(item.unidades[e.pos].texto) : e.original, certo: corrigido(item, e) });
  }

  /* ---------------------------------------------------------------
   * Correção
   *   { clique: posição, pendentes: [ids] }      encontrar um erro
   *   { correcoes: { id: "texto" } }              corrigir
   * --------------------------------------------------------------- */

  function corrigir(item, resposta) {
    resposta = resposta || {};
    if (typeof resposta.clique === "number") {
      var e = erroNaPosicao(item, resposta.clique);
      if (e) {
        var p = {};
        p[e.id] = true;
        return { certo: true, incompleto: true, partes: p, detalhe: { etapa: "corrigir", erro: e.id } };
      }
      var pendentes = (resposta.pendentes || item.partes).map(function (id) { return erroPorId(item, id); }).filter(Boolean);
      if (!pendentes.length) return { certo: false, partes: {} };
      var alvo = pendentes.slice().sort(function (a, b) { return a.pos - b.pos; })[0];
      var q = {};
      q[alvo.id] = false;
      return { certo: false, partes: q, dica: M.t("tipos.detetive.certa." + item.modo), explicacao: explicacaoErro(item, alvo), detalhe: { certa: resposta.clique, alvo: alvo.id } };
    }
    var partes = {};
    var todas = true;
    var tentativas = 2;
    var expl = [];
    Object.keys(resposta.correcoes || {}).forEach(function (id) {
      var e = erroPorId(item, id);
      if (!e) return;
      var ok = aceite(item, e, resposta.correcoes[id]);
      partes[id] = ok;
      if (!ok) {
        todas = false;
        if (e.opcoes && e.opcoes.length === 2) tentativas = 1;
        expl.push(explicacaoErro(item, e));
      }
    });
    var r = { certo: todas && Object.keys(partes).length > 0, partes: partes, tentativas: tentativas };
    if (expl.length) r.explicacao = expl.join(" ");
    return r;
  }

  function resolver(item) {
    var c = {};
    item.erros.forEach(function (e) { c[e.id] = e.correcao[0]; });
    return { correcoes: c };
  }

  function errar(item) {
    var livre = item.unidades.filter(function (u) { return !erroNaPosicao(item, u.i); })[0];
    return { clique: livre.i, pendentes: item.partes.slice() };
  }

  function valorErrado(item, e) {
    if (e.opcoes) return e.opcoes.filter(function (o) { return !aceite(item, e, o); })[0];
    return e.original;
  }

  /* Erros encontrados, mas corrigidos mal. */
  function errarEtapa(item) {
    var c = {};
    item.erros.forEach(function (e) { c[e.id] = valorErrado(item, e); });
    return { correcoes: c };
  }

  /* ---------------------------------------------------------------
   * Desenho
   * --------------------------------------------------------------- */

  function desenhar(item, el, ctx) {
    var C = ctx.comp;
    var resolvidos = {};
    var verificadas = {};
    var aberto = null;
    var botoes = {};
    var total = item.erros.length;
    var contagem = C.el("p", { "class": "detetive-contagem" });
    var caixa = C.el("div", { "class": ["detetive-folha", "modo-" + item.modo] });
    var zona = C.el("div", { "class": "detetive-correcao" });
    el.appendChild(C.el("div", { "class": "detetive-cabeca" }, [
      C.el("span", { "class": "detetive-robo", "aria-hidden": "true" }, [ctx.desenhos.icone("detetive")]),
      C.el("p", { "class": "detetive-pedido", text: M.tn("tipos.detetive.pedido." + item.modo, total) }),
      contagem
    ]));
    el.appendChild(caixa);
    el.appendChild(zona);

    if (item.modo === "algoritmo") {
      caixa.appendChild(grelhaAlgoritmo(item, C, function (b, u) { botoes[u.i] = b; }, clicar));
    } else if (item.modo === "lista") {
      var ul = C.el("ol", { "class": "detetive-linhas" });
      item.unidades.forEach(function (u) {
        var b = C.botao([C.el("span", { "class": "detetive-texto", text: u.texto })], function () { clicar(u.i); }, "detetive-linha", { "data-unidade": u.i });
        botoes[u.i] = b;
        ul.appendChild(C.el("li", {}, [b]));
      });
      caixa.appendChild(ul);
    } else {
      var p = C.el("p", { "class": "detetive-texto-corrido" });
      item.unidades.forEach(function (u, k) {
        if (k > 0) p.appendChild(document.createTextNode(" "));
        var b = C.botao([C.el("span", { "class": "detetive-texto", text: u.texto })], function () { clicar(u.i); }, "detetive-palavra", { "data-unidade": u.i });
        botoes[u.i] = b;
        p.appendChild(b);
      });
      caixa.appendChild(p);
    }
    atualizarContagem();

    function pendentes() { return item.partes.filter(function (id) { return !resolvidos[id]; }); }

    function atualizarContagem() {
      var feitos = total - pendentes().length;
      contagem.textContent = M.t("tipos.detetive.contagem", { feitos: feitos, total: total });
    }

    function bloquearTudo(sim) {
      Object.keys(botoes).forEach(function (k) {
        var b = botoes[k];
        if (b.classList.contains("resolvido") || verificadas[k]) return;
        b.disabled = !!sim;
      });
    }

    function mostrarErro(e, classe) {
      resolvidos[e.id] = classe;
      var b = botoes[e.pos];
      C.limpar(b);
      b.appendChild(C.el("span", { "class": "detetive-texto", text: item.modo === "lista" ? corrigido(item, e) : corrigido(item, e) }));
      if (classe === "mostrado") b.appendChild(C.el("span", { "class": "detetive-antes", text: item.modo === "lista" ? e.original : e.original }));
      b.classList.remove("a-corrigir");
      b.classList.add("resolvido", classe);
      b.disabled = true;
      atualizarContagem();
    }

    function clicar(pos) {
      if (ctx.terminado || aberto || verificadas[pos]) return;
      var r = ctx.responder({ clique: pos, pendentes: pendentes() });
      if (!r) return;
      var e = erroNaPosicao(item, pos);
      if (e && r.estado === "continuar") { abrir(e); return; }
      verificadas[pos] = true;
      botoes[pos].classList.add("verificada");
      botoes[pos].disabled = true;
      var alvo = r.detalhe && r.detalhe.alvo;
      if (alvo && r.partes && r.partes[alvo] === "errado") mostrarErro(erroPorId(item, alvo), "mostrado");
    }

    function abrir(e) {
      aberto = e;
      var b = botoes[e.pos];
      b.classList.add("a-corrigir");
      bloquearTudo(true);
      C.limpar(zona);
      zona.appendChild(C.el("p", { "class": "pergunta detetive-pergunta" }, item.modo === "lista" ? [C.el("span", { text: M.t("tipos.detetive.corrige.lista") })] : [
        C.el("span", { text: M.t("tipos.detetive.corrige." + item.modo) + " " }),
        C.el("strong", { "class": "detetive-errado", text: "«" + e.original + "»" })
      ]));
      var acoes;
      if (e.opcoes && item.modo === "lista") {
        var ul = item.unidades[e.pos];
        zona.appendChild(C.el("p", { "class": "detetive-linha-edicao" }, [ul.antes, C.el("span", { "class": "detetive-espaco", text: "?" }), ul.depois]));
      }
      if (e.opcoes) {
        var esc = C.escolhas({
          opcoes: e.opcoes,
          aoEscolher: function (i) {
            var c = {};
            c[e.id] = e.opcoes[i];
            var r = ctx.responder({ correcoes: c });
            if (r && r.partes && r.partes[e.id] === "tentar") { esc.marcar(i, "tentado"); esc.desativar(i); }
            else fechar(r);
          }
        });
        esc.botoes.forEach(function (bt, i) { bt.setAttribute("data-correcao", e.opcoes[i]); });
        zona.appendChild(esc.el);
      } else {
        var semLetras = e.correcao.every(function (x) { return !/\p{L}/u.test(x); });
        if (item.modo === "algoritmo") zona.firstChild.lastChild.textContent = "«" + e.original + "» (" + SIGLA[item.colunas - 1 - e.pos] + ")";
        var campo = C.campoTexto({
          rotulo: M.t("tipos.detetive.corrige." + item.modo),
          classe: "campo-detetive",
          acentos: !semLetras,
          aoValidar: function () { if (!verificar.disabled) enviar(); }
        });
        campo.input.value = e.original;
        campo.input.setAttribute("data-campo-correcao", e.id);
        campo.input.addEventListener("input", function () { campo.input.classList.remove("tentar"); verificar.disabled = !campo.input.value.trim(); });
        var verificar = C.botao(M.t("geral.verificar"), enviar, "principal", { "data-acao-item": "verificar" });
        acoes = C.el("div", { "class": "acoes-item" }, [verificar]);
        if (item.modo === "lista") {
          /* A linha, com o campo no lugar da parte errada. */
          var u = item.unidades[e.pos];
          campo.input.style.width = Math.max(4, e.original.length + 3) + "ch";
          campo.input.classList.add("campo-na-linha");
          zona.appendChild(C.el("p", { "class": "detetive-linha-edicao" }, [u.antes, campo.input, u.depois]));
          zona.appendChild(campo.el);
        } else {
          zona.appendChild(campo.el);
        }
        zona.appendChild(acoes);
        setTimeout(function () { campo.focar(); try { campo.input.select(); } catch (err) { /* nada */ } }, 30);
      }

      function enviar() {
        var c = {};
        c[e.id] = campo.input.value;
        var r = ctx.responder({ correcoes: c });

  function validar(d, v) {

      } else if (v.lista(d, "valores", "valores", { obrigatorio: true, min: 6, max: 30 })) {

      }

      return X.itemNumero({ sub: "falta", assinatura: "f" + termos.join(",") + ":" + f, pergunta: t("falta"), sequencia: mostra, valor: termos[f],
        explicacao: expl + " " + passo(f), resumoEnunciado: t("falta") + " " + mostra.join(", ") });
    }
    return X.itemNumero({ sub: "seguinte", assinatura: "s" + termos.join(","), pergunta: t("seguinteNumero"), sequencia: termos.slice(0, 5).map(X.n).concat(["?"]), valor: termos[5],
      explicacao: expl + " " + passo(5), resumoEnunciado: t("seguinteNumero") + " " + termos.slice(0, 5).map(X.n).join(", ") + ", ?" });
  }

  function pedidos(d) {
    var g = d.gerar || {};
    if (g.pedir && g.pedir.length) return g.pedir;
    return (d.gerar && d.gerar.modo === "crescimento") ? ["seguinte", "regra", "falta"] : ["grupo", "seguinte", "posicao"];
  }

  function gerar1(d, rng, k, sub) {
    var pedido = sub || X.ciclo(pedidos(d), rng.derivar("pedir"))(k);
    if (d.gerar.modo === "crescimento") return questaoCrescimento(d.gerar, rng, pedido);
    var m = motivo(d.gerar, rng);
    return m ? questaoRepeticao(m, pedido, rng) : null;
  }

  function contar(d) {
    var rng = U.rng("capacidade-sequencia");
    var vistos = {};
    var n = 0;
    for (var k = 0; k < 300; k++) {
      var it = gerar1(d, rng, k);
      if (it && !vistos[it.assinatura]) { vistos[it.assinatura] = true; n++; }
    }
    return n;
  }

  /* ---------------------------------------------------------------
   * Desenho
   * --------------------------------------------------------------- */

  function formaSVG(nome, C) {
    var S = C.svg;
    var f;
    if (nome === "triangulo") f = S("polygon", { points: "24,5 44,41 4,41" });
    else if (nome === "circulo") f = S("circle", { cx: 24, cy: 24, r: 19 });
    else if (nome === "quadrado") f = S("rect", { x: 6, y: 6, width: 36, height: 36, rx: 3 });
    else if (nome === "estrela") f = S("polygon", { points: "24,3 30,17 45,18 33,28 37,43 24,35 11,43 15,28 3,18 18,17" });
    else if (nome === "losango") f = S("polygon", { points: "24,3 44,24 24,45 4,24" });
    else f = S("path", { d: "M24 42C10 32 4 24 4 16a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 8-6 16-20 26z" });
    f.setAttribute("class", "seq-forma forma-" + nome);
    return X.svg(48, 48, "seq-svg", [f]);
  }

  function token(x, C) {
    var nome = nomeToken(x);
    if (FORMAS.indexOf(x) >= 0) return C.el("span", { "class": "seq-token", role: "img", "aria-label": nome, title: nome }, [formaSVG(x, C)]);
    if (CORES[x]) {
      var b = C.el("span", { "class": "seq-cor", role: "img", "aria-label": nome, title: nome });
      b.style.background = CORES[x];
      return C.el("span", { "class": "seq-token" }, [b]);
    }
    return C.el("span", { "class": ["seq-token", "seq-texto", x === "?" ? "seq-falta" : "", x === "…" ? "seq-reticencias" : ""], text: x });
  }

  function linhaSequencia(item, C, clicavel, aoClicar) {
    var linha = C.el("div", { "class": "seq-linha" });
    var botoes = [];
    item.sequencia.forEach(function (x, i) {
      var el = token(x, C);
      if (clicavel) {
        var b = C.botao([el], function () { aoClicar(i); }, "seq-botao", { "data-pos": i, "aria-label": t("elemento", { n: i + 1, x: nomeToken(x) }) });
        botoes.push(b);
        linha.appendChild(b);
      } else linha.appendChild(el);
    });
    return { el: linha, botoes: botoes };
  }

  function desenharClicar(item, el, ctx) {
    var C = ctx.comp;
    el.appendChild(C.formatado(item.pergunta, "p", { "class": "pergunta" }));
    var tentados = {};
    var l = linhaSequencia(item, C, true, function (i) {
      if (ctx.terminado || tentados[i]) return;
      var r = ctx.responder(i);
      if (!r) return;
      if (ctx.desafio) { l.botoes[i].classList.add("escolhido"); return; }
      if (r.estado === "tentar") { tentados[i] = true; l.botoes[i].classList.add("tentado"); l.botoes[i].disabled = true; return; }
      for (var k = 0; k <= item.certa; k++) l.botoes[k].classList.add(r.estado === "certo" ? "grupo-certo" : "grupo-mostrado");
      if (r.estado === "errado") l.botoes[i].classList.add("tentado");
    });
    el.appendChild(C.el("div", { "class": "mat-figura" }, [l.el]));
  }

  function desenhar(item, el, ctx) {
    var C = ctx.comp;
    if (item.forma === "clicar") return desenharClicar(item, el, ctx);
    X.desenhar(item, el, ctx, { figura: function (f) { f.appendChild(linhaSequencia(item, C, false).el); } });
    if (item.tokens) {
      Array.prototype.forEach.call(el.querySelectorAll(".escolhas .opcao"), function (b, i) {
        var x = item.opcoes[Number(b.getAttribute("data-opcao"))];
        C.limpar(b).appendChild(token(x, C));
        b.setAttribute("aria-label", nomeToken(x));
      });
      var esc = el.querySelector(".escolhas");
      if (esc) esc.classList.add("seq-opcoes");
    }
  }

  /* ---------------------------------------------------------------
   * Validação e registo
   * --------------------------------------------------------------- */

  function validarItens(d, v) {
    if (!v.lista(d, "itens", "itens", { obrigatorio: true, min: 1 })) {
      if (d.itens === undefined) v.erro("", "il faut « gerar » ou « itens »."); return;
    }
    d.itens.forEach(function (it, i) {
      var c = "itens[" + i + "]";
      if (!it || typeof it !== "object" || Array.isArray(it)) { v.erro(c, "objet attendu : { \"termos\": [\"triangulo\", \"circulo\", \"circulo\", …], \"grupo\": 3 }."); return; }
      v.campos(it, c, ["termos", "grupo", "dica", "explicacao"]);
      v.dicaExplicacao(it, c);
      if (!v.inteiro(it, "grupo", c + ".grupo", { obrigatorio: true, min: 2, max: 6 })) return;
      if (!v.listaTextos(it, "termos", c + ".termos", { obrigatorio: true, min: it.grupo * 2, max: 18 })) return;
      var ok = it.termos.every(function (x, k) { return x === it.termos[k % it.grupo]; });
      if (!ok) { v.erro(c + ".termos", "les termos ne répètent pas un grupo de " + it.grupo + " : chaque élément doit être égal à celui qui est " + it.grupo + " places avant."); return; }
      if (periodoMinimo(it.termos) !== it.grupo) v.erro(c + ".grupo", "le vrai grupo de repetição a " + periodoMinimo(it.termos) + " élément(s), pas " + it.grupo + ".");
      if (it.termos.some(function (x) { return x.length > 6 && FORMAS.indexOf(x) < 0 && !CORES[x]; })) v.aviso(c + ".termos", "éléments longs : une case de sequência tient une forme, une couleur, une lettre ou un nombre.");
    });
    v.mostrarItens(d, d.itens.length, { padrao: 4 });
  }

  function prepararItem(d, raw, rng, origem, k) {
    var m = raw.termos.slice(0, raw.grupo);
    var it = questaoRepeticao(m, X.ciclo(["grupo", "seguinte", "posicao"], rng.derivar("pedir" + origem))(k || 0), rng, origem);
    if (raw.dica) it.dica = raw.dica;
    if (raw.explicacao) it.explicacao = raw.explicacao;
    return it;
  }

  M.registarTipo("sequencia", {
    desafio: true,
    campos: ["gerar", "itens"],
    icone: ["M3 15l3-6 3 6z", "M13 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0", "M18 9h3v6h-3z"],

    validar: function (d, v) {
      if (d.gerar === undefined) { validarItens(d, v); return; }
      var g = X.validarGerar(d, v, ESQUEMA);
      if (!g) return;
      var rep = g.modo === "repeticao";
      var proibidos = rep ? ["passos", "max", "subtrair"] : ["grupo", "elementos"];
      var antes = v.saida.erros.length;
      proibidos.forEach(function (k) { if (g[k] !== undefined) v.erro("gerar." + k, "inutile pour le modo " + g.modo + "."); });
      if (g.pedir) g.pedir.forEach(function (p) { if ((rep ? ["grupo", "seguinte", "posicao"] : ["seguinte", "regra", "falta"]).indexOf(p) < 0) v.erro("gerar.pedir", "« " + p + " » n'existe pas pour le modo " + g.modo + "."); });
      if (g.grupo && g.grupo.length === 2 && g.grupo[0] > g.grupo[1]) v.erro("gerar.grupo", "[minimum, maximum] attendu.");
      if (v.saida.erros.length !== antes) return;
      var cap = contar(d);
      if (!cap) { v.erro("gerar", "ces paramètres ne produisent aucune question (passos trop grands pour max ?)."); return; }
      X.verificarCapacidade(d, v, cap, 6);
    },

    preparar: function (d, rng, ctx) {
      if (d.gerar) return X.distintos(ctx.quantos || M.mostrar(d, 6), function (k) { return gerar1(d, rng, k); });
      var n = ctx.quantos || M.mostrar(d, 4, d.itens.length);
      return U.selecionar(d.itens.length, n, rng, ctx.vistos).map(function (i, k) { return prepararItem(d, d.itens[i], rng, i, k); });
    },

    repetir: function (d, falhados, rng) {
      if (d.gerar) return X.repetirGerado(falhados, rng, function (f, k) { return gerar1(d, rng, k, f.sub); });
      return falhados.map(function (f, k) { return prepararItem(d, d.itens[f.origem], rng, f.origem, k + 1); });
    },

    corrigir: function (item, resposta) {
      if (item.forma === "clicar") return { certo: resposta === item.certa };
      return X.corrigir(item, resposta);
    },
    resolver: function (item) { return item.forma === "clicar" ? item.certa : X.resolver(item); },
    errar: function (item) { return item.forma === "clicar" ? item.certa + 1 : X.errar(item); },
    resumo: function (item) {
      var seq = (item.sequencia || []).map(nomeToken).join(", ");
      if (item.forma === "clicar") return { enunciado: item.pergunta + " " + seq, resposta: item.motivo.map(nomeToken).join(", "), explicacao: item.explicacao };
      if (item.forma === "escolha") return { enunciado: item.pergunta + " " + seq, resposta: nomeToken(item.opcoes[item.certa]), explicacao: item.explicacao };
      return X.resumo(item);
    },
    textos: function (d) {
      var saida = [];
      (Array.isArray(d.itens) ? d.itens : []).forEach(function (it, i) {
        if (it && Array.isArray(it.termos)) saida.push({ rotulo: "sequência " + (i + 1), texto: it.termos.map(function (x) { return typeof x === "string" ? nomeToken(x) : String(x); }).join(", ") });
        if (it && it.dica) saida.push({ rotulo: "pista", texto: it.dica });
      });
      return saida;
    },

    desenhar: desenhar,
    simular: function (item, el, resposta) {
      if (item.forma !== "clicar") { X.simular(item, el, resposta); return; }
      var b = el.querySelector('.seq-botao[data-pos="' + resposta + '"]');
      if (b && b.disabled) b = Array.prototype.filter.call(el.querySelectorAll(".seq-botao"), function (x) { return !x.disabled && Number(x.getAttribute("data-pos")) !== item.certa; })[0];
      if (b) b.click();
    }
  });
})(Motor);

(function () {
  function arrancar() { Motor.iniciar(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arrancar);
  else arrancar();
})();
</script>
</body>
